<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prefiltro de candidatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2F7; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4E5D72; --line:#D3DAE5;
    --accent:#1F4FFF; --accent-ink:#FFFFFF; --accent-soft:#E3EAFF;
    --ok:#0F7B55; --ok-soft:#DDF3EA; --warn:#7A5000; --warn-soft:#FFF0CC;
    --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
    --body:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
      --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
      --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
    --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
    --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.55;
  }
  .wrap{max-width:680px; margin:0 auto; padding:20px 20px 64px}
  .brand{
    display:flex; align-items:center; gap:10px; padding:6px 0 28px;
    font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.01em;
  }
  .brand-mark{
    width:28px; height:28px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
    display:grid; place-items:center; font-size:15px; font-weight:700;
  }
  .brand small{font-family:var(--body); font-weight:500; color:var(--muted); font-size:14px}

  h1{
    font-family:var(--display); font-weight:700; font-size:clamp(30px,7vw,44px);
    line-height:1.08; letter-spacing:-.02em; margin:0 0 12px;
  }
  h1:focus{outline:none}
  h2{font-family:var(--display); font-weight:700; font-size:20px; line-height:1.2; margin:0 0 8px}
  .lead{color:var(--muted); font-size:17px; max-width:52ch; margin:0 0 28px}
  p{margin:0 0 12px}

  /* Menú */
  .menu{list-style:none; margin:0; padding:0}
  .menu li{border-top:1px solid var(--line)}
  .menu li:last-child{border-bottom:1px solid var(--line)}
  .row{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:none; border:0; color:inherit; font:inherit; text-align:left; cursor:pointer;
    padding:16px 4px; min-height:64px;
  }
  .row:hover .row-title{color:var(--accent)}
  .row-title{font-weight:600; display:block}
  .row-hint{color:var(--muted); font-size:14px; display:block}
  .chev{flex:none; width:20px; height:20px; color:var(--muted)}
  .primary-row{
    background:var(--accent); color:var(--accent-ink); border-radius:14px; padding:18px 20px;
    margin-bottom:22px; border:0;
  }
  .primary-row .row-hint{color:inherit; opacity:.85}
  .primary-row:hover .row-title{color:inherit}
  .primary-row .chev{color:inherit}

  /* Botones */
  .btn{
    font:inherit; font-weight:600; cursor:pointer; border-radius:12px; padding:13px 20px;
    border:1.5px solid var(--ink); background:transparent; color:var(--ink); min-height:48px;
  }
  .btn:hover{background:var(--accent-soft); border-color:var(--accent)}
  .btn.solid{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.solid:hover{filter:brightness(1.08)}
  .btn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
  .actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
  .linkback{
    background:none; border:0; padding:6px 0; margin:0 0 20px; font:inherit; font-weight:600;
    color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .linkback:hover{color:var(--accent)}
  :focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:6px}

  /* Vacantes */
  .vac{
    width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px;
    margin-bottom:14px; display:block;
  }
  .vac:hover{border-color:var(--accent)}
  .vac h2{margin-bottom:6px}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .chip{
    font-size:13px; font-weight:600; padding:4px 10px; border-radius:999px;
    background:var(--accent-soft); color:var(--ink);
  }

  /* Ficha */
  .sheet{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:8px 20px}
  .sheet dl{margin:0}
  .item{padding:16px 0; border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item dt{font-weight:600; color:var(--muted); font-size:14px; margin-bottom:4px}
  .item dd{margin:0}
  .plain{margin:0; padding-left:1.1em}
  .plain li{margin-bottom:4px}
  .steps{list-style:none; margin:0; padding:0; counter-reset:s}
  .steps li{
    counter-increment:s; position:relative; padding:0 0 16px 44px; min-height:32px;
  }
  .steps li::before{
    content:counter(s); position:absolute; left:0; top:0; width:30px; height:30px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink); display:grid; place-items:center;
    font-weight:700; font-size:14px;
  }
  .steps li::after{
    content:""; position:absolute; left:14px; top:32px; bottom:2px; width:2px; background:var(--line);
  }
  .steps li:last-child{padding-bottom:0}
  .steps li:last-child::after{display:none}

  .ask{
    margin-top:24px; padding:20px; border-radius:16px; background:var(--accent-soft);
  }
  .ask h2{margin-bottom:4px}
  .ask p{color:var(--muted); margin:0}

  /* Filtro */
  .progress{display:flex; gap:6px; margin:0 0 8px}
  .progress i{flex:1; height:5px; border-radius:3px; background:var(--line)}
  .progress i.on{background:var(--accent)}
  .stepno{color:var(--muted); font-size:14px; margin:0 0 20px}
  textarea{
    width:100%; min-height:160px; padding:14px; font:inherit; color:var(--ink);
    background:var(--surface); border:1.5px solid var(--line); border-radius:12px; resize:vertical;
  }
  textarea:focus{outline:3px solid var(--accent); outline-offset:2px; border-color:var(--accent)}
  .hint{color:var(--muted); font-size:14px; margin-top:8px}
  .fld{display:block; font-weight:600; font-size:14px; margin:18px 0 6px}
  .inp{width:100%; font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:12px}
  .inp:focus{outline:3px solid var(--accent); outline-offset:2px; border-color:var(--accent)}
  .err{color:var(--warn); background:var(--warn-soft); padding:10px 14px; border-radius:10px; margin-top:12px; font-size:15px}
  .choices{display:grid; gap:12px}
  .choices.two{grid-template-columns:1fr 1fr}
  .choices .btn{text-align:center}
  .note{color:var(--muted); font-size:14px; margin-top:28px}

  /* Resultado */
  .result{border-radius:18px; padding:24px}
  .result.ok{background:var(--ok-soft)}
  .result.later{background:var(--warn-soft)}
  .result h1{margin-bottom:10px}
  .result ul{margin:10px 0 0; padding-left:1.1em}

  .role{font-size:18px; line-height:1.65; max-width:60ch; margin:0 0 4px}
  .topics{display:flex; flex-wrap:wrap; gap:10px; margin-top:4px}
  .topic{font:inherit; font-weight:600; cursor:pointer; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:999px; padding:10px 18px; min-height:44px}
  .topic:hover{border-color:var(--accent)}
  .topic[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .topic-panel{margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px}
  .topic-panel[hidden]{display:none}
  .topic-panel h2{font-size:16px; color:var(--muted)}
  @media (prefers-reduced-motion: no-preference){
    .swap{animation:in .25s ease-out}
    @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  }
  @media (max-width:420px){ .choices.two{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></span>
    <span>Reclutamiento</span>
  </div>
  <main id="app" aria-live="polite"></main>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
   CONFIGURACIÓN: edita aquí
   ============================================================ */
const CFG = window.CONFIG || {};       // Se edita en config.js
const AGENDA_LINK = CFG.AGENDA_LINK || "";
const ENDPOINT = CFG.ENDPOINT || "";
const AVISO_URL = CFG.AVISO_URL || "";
const CONTACTO_TEXTO = "Un integrante del equipo de reclutamiento te atenderá. Escríbenos por el mismo canal por el que te contactamos.";

/* Las vacantes se cargan desde tu hoja de Google (se administran en admin.html).
   Esta lista solo se usa si ENDPOINT está vacío (modo prueba local). */
let VACANTES = [];
let carga = { estado: ENDPOINT ? "cargando" : "listo" };

const NIVELES_INGLES = ["A1 a B1", "B2", "B2+", "C1", "Nativo"];
const NIVELES_REQ = ["ninguno", "B2", "B2+", "C1", "Nativo"];
const nivelIdx = n => NIVELES_INGLES.indexOf(n);
const nPreg = v => arr(v && v.preguntas).length;
const fmtMonto = n => String(n == null ? "" : n).replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const MONEDAS = [
  { code: "COP", label: "Pesos colombianos (COP)", simbolo: "$", min: 300000, max: 100000000, ejemplo: "4.500.000" },
  { code: "USD", label: "Dólares (USD)", simbolo: "US$", min: 200, max: 50000, ejemplo: "1.500" },
  { code: "EUR", label: "Euros (EUR)", simbolo: "€", min: 200, max: 50000, ejemplo: "1.500" },
  { code: "MXN", label: "Pesos mexicanos (MXN)", simbolo: "MX$", min: 3000, max: 800000, ejemplo: "25.000" }
];
const monedaSimbolo = c => (MONEDAS.find(m => m.code === c) || MONEDAS[0]).simbolo;
const monedaInfo = c => MONEDAS.find(m => m.code === c) || MONEDAS[0];
const MIN_CARACTERES = 25;

/* ---------- Preguntas del prefiltro ----------
   Cada vacante trae su lista de preguntas desde admin.html. Tipos:
   texto (respuesta abierta), sino (Sí/No), opciones, ingles (nivel) y salario.
   Las vacantes creadas antes de este cambio usan las 5 preguntas de siempre. */
const TIPOS = ["texto", "sino", "opciones", "ingles", "salario"];
function preguntasPorDefecto(v){
  const ps = [
    { id: "exp", tipo: "texto", texto: "Cuéntanos sobre tu experiencia relacionada con este rol", ayuda: "Puedes mencionar cargos, funciones, herramientas o logros.", min: MIN_CARACTERES, palabras: arr(v.palabrasClave) },
    { id: "full", tipo: "sino", texto: "¿Tienes disponibilidad de tiempo completo?", ayuda: "", pasa: "Sí" },
    { id: "viaje", tipo: "sino", texto: "¿Tienes algún viaje planeado próximamente?", ayuda: "", pasa: "No" }
  ];
  if(v.inglesMin !== "ninguno") ps.push({ id: "ingles", tipo: "ingles", texto: "¿Cuál es tu nivel de inglés?", ayuda: "Elige el que mejor te describa.", min: NIVELES_REQ.includes(v.inglesMin) ? v.inglesMin : "B2+" });
  ps.push({ id: "salario", tipo: "salario", texto: "¿Cuál es tu expectativa salarial?", ayuda: "", tope: v.salarioMax, moneda: v.monedaSalarioMax });
  return ps;
}
function normPregunta(p, i){
  p = p || {};
  const tipo = TIPOS.includes(p.tipo) ? p.tipo : "texto";
  const q = { id: String(p.id || ("q" + i)), tipo, texto: String(p.texto || "").trim(), ayuda: String(p.ayuda || "").trim() };
  if(tipo === "texto"){
    q.min = Math.max(0, Math.min(500, parseInt(p.min, 10) || 0));
    q.palabras = arr(p.palabras).map(k => norm(String(k)).trim()).filter(Boolean);
  } else if(tipo === "sino"){
    q.pasa = ["Sí", "No"].includes(p.pasa) ? p.pasa : "cualquiera";
  } else if(tipo === "opciones"){
    q.opciones = arr(p.opciones).map(x => String(x).trim()).filter(Boolean);
    q.aprobadas = arr(p.aprobadas).map(String).filter(x => q.opciones.includes(x));
  } else if(tipo === "ingles"){
    q.min = NIVELES_REQ.includes(p.min) ? p.min : "B2+";
  } else if(tipo === "salario"){
    q.tope = Number(String(p.tope == null ? "" : p.tope).replace(/\D/g, "")) || 0;
    q.moneda = MONEDAS.some(m => m.code === p.moneda) ? p.moneda : "COP";
  }
  return q;
}
const preguntaValida = q => q.texto && (q.tipo !== "opciones" || q.opciones.length >= 2);
function pasaPregunta(q, r){
  if(q.tipo === "texto"){
    const t = norm(String(r || ""));
    return t.trim().length >= q.min && (q.palabras.length === 0 || q.palabras.some(k => t.includes(k)));
  }
  if(q.tipo === "sino") return q.pasa === "cualquiera" || r === q.pasa;
  if(q.tipo === "opciones") return q.aprobadas.length === 0 || q.aprobadas.includes(r);
  if(q.tipo === "ingles") return q.min === "ninguno" || nivelIdx(r) >= nivelIdx(q.min);
  if(q.tipo === "salario"){
    const pide = Number(String((r && r.monto) || "").replace(/\D/g, "")) || 0;
    return !(q.tope > 0 && r && r.moneda === q.moneda && pide > q.tope);
  }
  return true;
}
function textoRespuesta(q, r){
  if(q.tipo === "salario") return r && r.monto ? `${r.moneda} ${fmtMonto(r.monto)}` : "";
  return String(r == null ? "" : r).trim();
}

/* ============================================================ */
const $app = document.getElementById("app");
const activas = () => VACANTES.filter(v => v.estado === "Activa");
const vacById = id => VACANTES.find(v => v.id === id);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const arr = x => Array.isArray(x) ? x.filter(Boolean) : [];
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function normalizar(v){
  const lst = x => arr(x).map(esc);
  return {
    id: String(v.id), estado: String(v.estado || "Activa"),
    nombreRaw: String(v.nombre || ""), nombre: esc(v.nombre), descripcion: esc(v.descripcion),
    sedes: lst(v.sedes), responsabilidades: lst(v.responsabilidades), salario: esc(v.salario), beneficios: lst(v.beneficios),
    horario: esc(v.horario), modalidad: esc(v.modalidad), etapas: lst(v.etapas),
    tiempos: esc(v.tiempos), requisitos: lst(v.requisitos),
    palabrasClave: arr(v.palabrasClave).map(k => norm(String(k))),
    inglesMin: NIVELES_REQ.includes(v.inglesMin) ? v.inglesMin : "B2+",
    salarioMax: Number(String(v.salarioMax == null ? "" : v.salarioMax).replace(/\D/g, "")) || 0,
    monedaSalarioMax: MONEDAS.some(m => m.code === v.monedaSalarioMax) ? v.monedaSalarioMax : "COP",
    linkAgenda: /^https:\/\//i.test(v.linkAgenda || "") ? esc(v.linkAgenda) : "",
    preguntas: (arr(v.preguntas).length ? arr(v.preguntas) : preguntasPorDefecto(v)).map(normPregunta).filter(preguntaValida),
    reclutadores: [
      { nombre: esc(v.rec1Nombre) || "Reclutador 1", link: v.linkAgenda },
      { nombre: esc(v.rec2Nombre) || "Reclutador 2", link: v.rec2Link },
      { nombre: esc(v.rec3Nombre) || "Reclutador 3", link: v.rec3Link }
    ].filter(r => /^https:\/\//i.test(r.link || "")).map(r => ({ nombre: r.nombre, link: esc(r.link) }))
  };
}
async function cargarVacantes(){
  if(!ENDPOINT){ carga.estado = "listo"; return; }
  carga.estado = "cargando"; if(state.view === "home") render();
  try{
    const r = await fetch(ENDPOINT + "?accion=vacantes&t=" + Date.now());
    const j = await r.json();
    VACANTES = (j.vacantes || []).filter(v => v && v.id).map(normalizar);
    carga.estado = "listo";
  }catch(e){ carga.estado = "error"; }
  if(state.view === "home") render();
}
const CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>';
const BACK = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"/></svg>';

const TEMAS = {
  responsabilidades: { titulo: "Responsabilidades" },
  salario:    { titulo: "Salario" },
  beneficios: { titulo: "Beneficios" },
  ubicacion:  { titulo: "Ubicación" },
  modalidad:  { titulo: "Modalidad" },
  horario:    { titulo: "Horario" },
  requisitos: { titulo: "Requisitos" },
  etapas:     { titulo: "Proceso de selección" }
};
const hasTema = (id, v) => ({
  responsabilidades: arr(v.responsabilidades).length > 0,
  salario: !!v.salario,
  beneficios: arr(v.beneficios).length > 0,
  ubicacion: arr(v.sedes).length > 0,
  modalidad: !!v.modalidad,
  horario: !!v.horario,
  requisitos: arr(v.requisitos).length > 0,
  etapas: arr(v.etapas).length > 0 || !!v.tiempos
}[id]);

let state = { view: "home", vacId: null, tema: null, step: 0, ans: {}, moneda: "COP", datos: { nombre: "", correo: "" }, err: "" };

const ul = a => '<ul class="plain">' + arr(a).map(x => `<li>${x}</li>`).join("") + "</ul>";
const back = (action, label) => `<button class="linkback" data-a="${action}">${BACK}${label}</button>`;
const item = (dt, dd) => dd ? `<div class="item"><dt>${dt}</dt><dd>${dd}</dd></div>` : "";

function temaContenido(id, v){
  switch(id){
    case "responsabilidades": return ul(v.responsabilidades);
    case "salario":    return `<p style="font-size:20px;font-weight:600;margin:0">${v.salario}</p>`;
    case "beneficios": return ul(v.beneficios);
    case "ubicacion":  return ul(v.sedes);
    case "modalidad":  return `<p style="margin:0">${v.modalidad}</p>`;
    case "horario":    return `<p style="margin:0">${v.horario}</p>`;
    case "requisitos": return ul(v.requisitos);
    case "etapas":
      return (arr(v.etapas).length ? `<ol class="steps">${arr(v.etapas).map(e => `<li>${e}</li>`).join("")}</ol>` : "")
           + (v.tiempos ? `<p style="margin:${arr(v.etapas).length ? "16px" : "0"} 0 0">El proceso toma entre <strong>${v.tiempos}</strong>.</p>` : "");
  }
}

/* ---------- Vistas ---------- */
function vHome(){
  if(carga.estado === "cargando"){
    return `<div class="swap"><h1 tabindex="-1">Vacantes disponibles</h1><p class="lead">Cargando vacantes…</p></div>`;
  }
  if(carga.estado === "error"){
    return `<div class="swap"><h1 tabindex="-1">Vacantes disponibles</h1>
      <p class="lead">No pudimos cargar las vacantes. Revisa tu conexión e intenta de nuevo.</p>
      <div class="actions"><button class="btn solid" data-a="reintentar">Reintentar</button></div></div>`;
  }
  const a = activas();
  if(!a.length){
    return `<div class="swap"><h1 tabindex="-1">Vacantes disponibles</h1>
      <p class="lead">Por ahora no tenemos vacantes abiertas. Vuelve pronto.</p></div>`;
  }
  return `<div class="swap">
    <h1 tabindex="-1">Vacantes disponibles</h1>
    <p class="lead">Elige una vacante para conocer los detalles y averiguar si tu perfil encaja.</p>
    ${a.map(v => {
      const chips = [...arr(v.sedes).map(x => x.split(" (")[0]), v.modalidad ? v.modalidad.split(";")[0].trim() : "", v.horario || ""].filter(Boolean);
      return `<button class="vac" data-a="vac" data-id="${esc(v.id)}">
        <h2>${v.nombre}</h2>
        ${chips.length ? `<div class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join("")}</div>` : ""}
      </button>`;
    }).join("")}
  </div>`;
}

function vVac(){
  const v = vacById(state.vacId);
  const temas = Object.keys(TEMAS).filter(t => hasTema(t, v));
  return `<div class="swap">${back("home","Ver otras vacantes")}
    <h1 tabindex="-1">${v.nombre}</h1>
    ${v.descripcion ? `<h2>Sobre el rol</h2><p class="role">${v.descripcion}</p>` : ""}
    ${temas.length ? `<h2 style="margin-top:28px">Conoce más</h2>
      <div class="topics">${temas.map(t => `<button class="topic" data-a="chip" data-id="${t}" aria-pressed="false">${TEMAS[t].titulo}</button>`).join("")}</div>
      <div class="topic-panel" id="topicPanel" hidden aria-live="polite"></div>` : ""}
    <div class="ask" style="margin-top:32px"><h2>¿Te interesa esta vacante?</h2><p>${nPreg(v) === 0 ? "Si tu respuesta es sí, solo te pediremos tus datos de contacto." : nPreg(v) === 1 ? "Si tu respuesta es sí, te haremos 1 pregunta rápida para saber si puedes agendar entrevista." : `Si tu respuesta es sí, te haremos ${nPreg(v)} preguntas rápidas para saber si puedes agendar entrevista.`}</p>
      <div class="actions" style="margin-top:16px">
        <button class="btn solid" data-a="filtro">Sí, me interesa</button>
        <button class="btn" data-a="no-interes">No por ahora</button>
      </div></div>
  </div>`;
}

function vNoInteres(){
  return `<div class="swap"><h1 tabindex="-1">Gracias por tu tiempo</h1>
    <p class="lead">Cuando quieras retomar, aquí estaremos. Puedes revisar otras vacantes.</p>
    <div class="actions"><button class="btn solid" data-a="home">Ver otras vacantes</button></div></div>`;
}

function vConsent(){
  const link = AVISO_URL ? ` <a href="${AVISO_URL}" target="_blank" rel="noopener" style="color:var(--accent)">Ver política de tratamiento de datos</a>.` : "";
  return `<div class="swap">${back("vac-page","Volver a la vacante")}
    <h1 tabindex="-1">Antes de empezar</h1>
    <p class="lead">Para evaluar tu perfil y poder contactarte vamos a guardar tu nombre, tu correo y las respuestas que nos compartas en este prefiltro.</p>
    <div class="sheet" style="padding:20px">
      <p>Usamos esta información solo para el proceso de selección y para medir cómo funciona este prefiltro. Solo el equipo de reclutamiento puede consultarla.</p>
      <p>Como titular de tus datos tienes derecho a conocerlos, actualizarlos y solicitar su supresión (Ley 1581 de 2012). Puedes ejercerlos escribiendo al equipo de reclutamiento.${link}</p>
      <label style="display:flex;gap:12px;align-items:flex-start;margin-top:16px;cursor:pointer">
        <input type="checkbox" id="okDatos" style="width:22px;height:22px;margin-top:2px;accent-color:var(--accent)">
        <span>Autorizo el tratamiento de mis datos para este proceso de selección.</span>
      </label>
    </div>
    <div class="actions"><button class="btn solid" id="btnAcepto" data-a="acepto" disabled>Acepto y continúo</button>
      <button class="btn" data-a="no-acepto">No acepto</button></div></div>`;
}

function vDatos(){
  const d = state.datos;
  return `<div class="swap">${back("filtro","Volver")}
    <h1 tabindex="-1">Tus datos de contacto</h1>
    <p class="lead">Así podremos comunicarnos contigo sobre tu postulación.</p>
    <label class="fld" for="nombre">Nombre completo</label>
    <input class="inp" type="text" id="nombre" autocomplete="name" value="${esc(d.nombre)}">
    <label class="fld" for="correo">Correo electrónico</label>
    <input class="inp" type="email" id="correo" autocomplete="email" inputmode="email" value="${esc(d.correo)}">
    ${state.err ? `<div class="err" role="alert">${state.err}</div>` : ""}
    <div class="actions"><button class="btn solid" data-a="datos-ok">Continuar</button></div></div>`;
}

function progress(){
  const n = nPreg(vacById(state.vacId));
  return `<div class="progress" aria-hidden="true">${Array.from({ length: n }, (_, i) => i).map(i => `<i class="${i <= state.step ? "on" : ""}"></i>`).join("")}</div>
          <p class="stepno">Pregunta ${state.step + 1} de ${n}</p>`;
}

const preguntaActual = () => arr((vacById(state.vacId) || {}).preguntas)[state.step];

function vPregunta(){
  const s = state.step, q = preguntaActual(), r = state.ans[q.id];
  const prev = s === 0 ? back("vac-page","Volver a la vacante") : back("prev","Pregunta anterior");
  const lead = q.ayuda ? `<p class="lead" style="margin-bottom:16px">${esc(q.ayuda)}</p>` : `<p class="lead" style="margin-bottom:16px">&nbsp;</p>`;
  const titulo = `<h1 tabindex="-1">${esc(q.texto)}</h1>`;
  const opcion = val => `<button class="btn" data-a="ans" data-v="${esc(val)}" aria-pressed="${r === val}">${esc(val)}</button>`;
  const err = state.err ? `<div class="err" role="alert">${state.err}</div>` : "";
  let body = "";
  if(q.tipo === "texto"){
    body = `${titulo}${lead}
      <label for="txt" class="hint" style="display:block;margin:0 0 8px">Tu respuesta</label>
      <textarea id="txt" maxlength="1200">${esc(r || "")}</textarea>
      ${err}
      <div class="actions"><button class="btn solid" data-a="next">Continuar</button></div>`;
  } else if(q.tipo === "sino"){
    body = `${titulo}${lead}<div class="choices two">${opcion("Sí")}${opcion("No")}</div>`;
  } else if(q.tipo === "opciones"){
    body = `${titulo}${lead}<div class="choices">${q.opciones.map(opcion).join("")}</div>`;
  } else if(q.tipo === "ingles"){
    body = `${titulo}${q.ayuda ? lead : `<p class="lead" style="margin-bottom:16px">Elige el que mejor te describa.</p>`}<div class="choices">${NIVELES_INGLES.map(opcion).join("")}</div>`;
  } else {
    const monedaFija = q.tope > 0;
    const monto = r && r.monto ? r.monto : "";
    body = `${titulo}
      ${q.ayuda ? `<p class="lead" style="margin-bottom:8px">${esc(q.ayuda)}</p>` : ""}
      ${monedaFija
        ? `<p class="lead" style="margin-bottom:8px">Esta vacante evalúa el salario en <strong>${monedaInfo(q.moneda).label}</strong>. Escribe tu expectativa mensual en esa moneda.</p>`
        : `${q.ayuda ? "" : `<p class="lead" style="margin-bottom:8px">Escribe el monto mensual y elige la moneda.</p>`}
      <label class="fld" for="moneda">Moneda</label>
      <select class="inp" id="moneda">${MONEDAS.map(m => `<option value="${m.code}" ${state.moneda === m.code ? "selected" : ""}>${m.label}</option>`).join("")}</select>`}
      <label class="fld" for="salario">Expectativa salarial mensual${monedaFija ? ` (${q.moneda})` : ""}</label>
      <input class="inp" type="text" id="salario" inputmode="numeric" autocomplete="off" value="${fmtMonto(monto)}">
      ${err}
      <div class="actions"><button class="btn solid" data-a="salario-ok">${s === nPreg(vacById(state.vacId)) - 1 ? "Enviar mis respuestas" : "Continuar"}</button></div>`;
  }
  return `<div class="swap">${prev}${progress()}${body}
    <p class="note">${ENDPOINT ? "Guardamos tus respuestas junto con tu nombre y correo para el proceso de selección." : "Tus respuestas se usan solo en esta pantalla y no se guardan."}</p></div>`;
}

function preguntasFallidas(){
  const v = vacById(state.vacId);
  return arr(v.preguntas).filter(q => !pasaPregunta(q, state.ans[q.id]));
}

function vResultado(){
  const apto = preguntasFallidas().length === 0;
  if(apto){
    const v0 = vacById(state.vacId) || {};
    const recs = arr(v0.reclutadores);
    let cta;
    if(recs.length > 1){
      cta = `<p>Ya recibimos tus datos. Te invito a agendar con uno de nuestros ${recs.length} reclutadores (de preferencia el que te contactó).</p>
        <div class="actions" style="flex-direction:column;align-items:stretch">${recs.map(r => `<a class="btn solid" href="${r.link}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">Agendar con ${r.nombre}</a>`).join("")}</div>`;
    } else if(recs.length === 1){
      cta = `<p>Ya recibimos tus datos. Da el siguiente paso y agenda tu entrevista con ${recs[0].nombre}.</p>
        <div class="actions"><a class="btn solid" href="${recs[0].link}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Agendar mi entrevista</a></div>`;
    } else if(AGENDA_LINK){
      cta = `<p>Ya recibimos tus datos. Da el siguiente paso y agenda tu entrevista con el equipo de reclutamiento.</p>
        <div class="actions"><a class="btn solid" href="${AGENDA_LINK}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Agendar mi entrevista</a></div>`;
    } else {
      cta = `<p>Ya recibimos tus datos. El equipo de reclutamiento te escribirá al correo que nos dejaste para coordinar la entrevista.</p>`;
    }
    return `<div class="swap"><div class="result ok"><h1 tabindex="-1">¡Genial! Tu perfil encaja</h1>
      ${cta}</div>
      <div class="actions"><button class="btn" data-a="home">Volver al inicio</button></div></div>`;
  }
  return `<div class="swap"><div class="result later"><h1 tabindex="-1">Gracias por postularte</h1>
    <p>Recibimos tu información. Revisaremos tu perfil y nos pondremos en contacto contigo.</p></div>
    <div class="actions"><button class="btn solid" data-a="home">Ver otras vacantes</button></div></div>`;
}

function enviarResultado(payload){
  if(!ENDPOINT) return;
  try{
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).catch(() => {});
  }catch(e){}
}

const VIEWS = { home: vHome, vac: vVac, consent: vConsent, datos: vDatos, nointeres: vNoInteres, pregunta: vPregunta, resultado: vResultado };

function render(){
  $app.innerHTML = VIEWS[state.view]();
  const h1 = $app.querySelector("h1");
  if(h1){ h1.focus({ preventScroll: true }); }
  window.scrollTo({ top: 0 });
}

function finalizar(){
  const v = vacById(state.vacId), a = state.ans, ps = arr(v.preguntas);
  const fallidas = preguntasFallidas();
  const primera = tipo => ps.find(q => q.tipo === tipo);
  const resp = q => q ? textoRespuesta(q, a[q.id]) : "";
  const pIngles = primera("ingles"), pSal = primera("salario");
  const pExp = ps.find(q => q.id === "exp") || primera("texto");
  const sal = pSal ? (a[pSal.id] || {}) : {};
  state.view = "resultado"; render();
  enviarResultado({
    tipo: "resultado", fecha: new Date().toISOString(), vacanteId: v.id, vacante: v.nombreRaw,
    pasa: fallidas.length === 0, fallas: fallidas.map(q => q.texto.length > 80 ? q.texto.slice(0, 77) + "…" : q.texto),
    respuestas: ps.map(q => ({ pregunta: q.texto, respuesta: resp(q) })),
    tiempoCompleto: resp(ps.find(q => q.id === "full")), viaje: resp(ps.find(q => q.id === "viaje")),
    ingles: pIngles ? resp(pIngles) : "No aplica",
    nombre: state.datos.nombre.trim(), correo: state.datos.correo.trim(), experiencia: resp(pExp),
    expectativaSalarial: Number(String(sal.monto || "").replace(/\D/g, "")) || 0, monedaSalarial: sal.moneda || ""
  });
}

function reiniciarFiltro(){
  const v = vacById(state.vacId);
  const pSal = arr(v && v.preguntas).find(q => q.tipo === "salario");
  state.step = 0; state.err = ""; state.ans = {};
  state.moneda = pSal && pSal.tope > 0 ? pSal.moneda : "COP";
  state.datos = { nombre: "", correo: "" };
}

function avanzar(){
  if(state.step < nPreg(vacById(state.vacId)) - 1){ state.step += 1; render(); } else { finalizar(); }
}

$app.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  const act = el.dataset.a;
  if(act === "home"){ state.view = "home"; render(); }
  else if(act === "reintentar"){ cargarVacantes(); }
  else if(act === "vac"){ state.vacId = el.dataset.id; state.tema = null; state.view = "vac"; render(); }
  else if(act === "vac-page"){ state.view = "vac"; render(); }
  else if(act === "chip"){
    const id = el.dataset.id;
    state.tema = state.tema === id ? null : id;
    document.querySelectorAll(".topic").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === state.tema)));
    const panel = document.getElementById("topicPanel");
    panel.innerHTML = state.tema ? `<h2>${TEMAS[state.tema].titulo}</h2>${temaContenido(state.tema, vacById(state.vacId))}` : "";
    panel.hidden = !state.tema;
  }
  else if(act === "filtro"){ state.view = "consent"; render(); }
  else if(act === "acepto"){ reiniciarFiltro(); state.view = "datos"; render(); }
  else if(act === "datos-ok"){
    const n = state.datos.nombre.trim(), c = state.datos.correo.trim();
    if(n.length < 3){ state.err = "Escribe tu nombre completo."; return render(); }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c)){ state.err = "Escribe un correo válido, por ejemplo nombre@correo.com."; return render(); }
    state.err = ""; state.step = 0;
    if(nPreg(vacById(state.vacId)) === 0) return finalizar();
    state.view = "pregunta"; render();
  }
  else if(act === "no-acepto"){ state.view = "nointeres"; render(); }
  else if(act === "no-interes"){
    const v = vacById(state.vacId);
    enviarResultado({ tipo: "no_interes", fecha: new Date().toISOString(), vacanteId: v.id, vacante: v.nombreRaw });
    state.view = "nointeres"; render();
  }
  else if(act === "prev"){ state.step = Math.max(0, state.step - 1); state.err = ""; render(); }
  else if(act === "next"){
    const q = preguntaActual();
    const txt = ((document.getElementById("txt") || {}).value || state.ans[q.id] || "");
    state.ans[q.id] = txt;
    const minimo = Math.max(1, q.min);
    if(txt.trim().length < minimo){ state.err = minimo > 1 ? "Cuéntanos un poco más para poder evaluar tu perfil." : "Escribe tu respuesta para continuar."; return render(); }
    state.err = ""; avanzar();
  }
  else if(act === "ans"){
    state.ans[preguntaActual().id] = el.dataset.v;
    avanzar();
  }
  else if(act === "salario-ok"){
    const q = preguntaActual();
    const inp = document.getElementById("salario");
    const digitos = ((inp ? inp.value : "") || "").replace(/\D/g, "");
    const moneda = q.tope > 0 ? q.moneda : state.moneda;
    state.ans[q.id] = { monto: digitos, moneda };
    const n = Number(digitos);
    const m = monedaInfo(moneda);
    if(!(n >= m.min && n <= m.max)){ state.err = `Escribe tu expectativa mensual completa en ${m.code}, por ejemplo ${m.ejemplo}.`; return render(); }
    state.err = "";
    avanzar();
  }
});

$app.addEventListener("input", e => {
  if(e.target.id === "nombre") state.datos.nombre = e.target.value;
  if(e.target.id === "correo") state.datos.correo = e.target.value;
  if(e.target.id === "salario"){
    const d = e.target.value.replace(/\D/g, "").slice(0, 10);
    e.target.value = fmtMonto(d);
  }
  if(e.target.id === "txt"){ const q = preguntaActual(); if(q) state.ans[q.id] = e.target.value; }
});

$app.addEventListener("change", e => {
  if(e.target.id === "okDatos"){ document.getElementById("btnAcepto").disabled = !e.target.checked; }
  if(e.target.id === "moneda") state.moneda = e.target.value;
});

render();
cargarVacantes();
</script>
</body>
</html>
