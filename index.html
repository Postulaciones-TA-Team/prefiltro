<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prefiltro de candidatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2F7; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4E5D72; --line:#D3DAE5;
    --accent:#1F4FFF; --accent-ink:#FFFFFF; --accent-soft:#E3EAFF;
    --ok:#0F7B55; --ok-soft:#DDF3EA; --warn:#7A5000; --warn-soft:#FFF0CC;
    --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
    --body:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
      --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
      --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
    --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
    --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  :root{--shadow:0 1px 2px rgba(15,27,45,.04), 0 8px 24px rgba(15,27,45,.06); --grad:linear-gradient(135deg,#1F4FFF 0%,#5B7CFF 55%,#8FA6FF 100%)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --grad:linear-gradient(135deg,#2A3F8F 0%,#3B57C4 60%,#5671E0 100%)} }
  :root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --grad:linear-gradient(135deg,#2A3F8F 0%,#3B57C4 60%,#5671E0 100%)}
  body{
    margin:0; color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
    background:radial-gradient(900px 340px at 50% -120px, var(--accent-soft), transparent 70%), var(--paper); background-attachment:fixed; min-height:100vh;
  }
  .wrap{max-width:680px; margin:0 auto; padding:16px 20px 72px}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0 26px}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:17px}
  .brand-mark{width:32px; height:32px; border-radius:10px; background:var(--grad); color:#fff; display:grid; place-items:center; box-shadow:var(--shadow)}
  .toppill{font-size:13px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px}
  h1{font-family:var(--display); font-weight:700; font-size:clamp(30px,7vw,42px); line-height:1.08; letter-spacing:-.025em; margin:0 0 12px}
  h1:focus{outline:none}
  h2{font-family:var(--display); font-weight:700; font-size:19px; line-height:1.25; margin:0 0 6px}
  .lead{color:var(--muted); font-size:17px; max-width:54ch; margin:0 0 24px}
  p{margin:0 0 12px}
  .eyebrow{display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:0 0 10px}
  :focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:8px}

  /* Botones */
  .btn{font:inherit; font-weight:600; cursor:pointer; border-radius:999px; padding:12px 22px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); min-height:48px; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; transition:transform .15s, filter .15s, border-color .15s}
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.solid{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 6px 16px rgba(31,79,255,.25)}
  .btn.solid:hover{filter:brightness(1.08); color:var(--accent-ink); transform:translateY(-1px)}
  .btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none}
  .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
  .linkback{background:none; border:0; padding:6px 0; margin:0 0 16px; font:inherit; font-size:15px; font-weight:600; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:6px}
  .linkback:hover{color:var(--accent)}

  /* Inicio */
  .hero{padding:4px 0 6px}
  .countrow{display:flex; align-items:center; gap:8px; margin:6px 0 14px; font-size:14px; font-weight:600; color:var(--muted)}
  .pulse{width:8px; height:8px; border-radius:50%; background:#1DB954; box-shadow:0 0 0 4px rgba(29,185,84,.18)}
  .vac{width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; display:flex; align-items:center; gap:16px;
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:12px; box-shadow:var(--shadow); transition:transform .18s, border-color .18s}
  .vac:hover{transform:translateY(-2px); border-color:var(--accent)}
  .vac-ico{flex:none; width:50px; height:50px; border-radius:15px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:18px}
  .vac-body{flex:1; min-width:0}
  .vac h2{margin:0 0 4px}
  .vac-desc{color:var(--muted); font-size:14px; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .tag{font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--paper); color:var(--ink)}
  .go{flex:none; width:38px; height:38px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; transition:transform .18s}
  .vac:hover .go{transform:translateX(3px)}
  .sk{height:96px; border-radius:20px; margin-bottom:12px; background:linear-gradient(90deg,var(--surface) 0%,var(--accent-soft) 50%,var(--surface) 100%); background-size:200% 100%; animation:sh 1.3s infinite linear; border:1px solid var(--line)}
  @keyframes sh{to{background-position:-200% 0}}
  .empty{text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:34px 22px; box-shadow:var(--shadow)}
  .empty .bigico{margin:0 auto 14px}

  /* Vacante */
  .vhero{background:var(--grad); color:#fff; border-radius:24px; padding:26px 22px 24px; box-shadow:var(--shadow); position:relative; overflow:hidden}
  .vhero::after{content:""; position:absolute; right:-60px; top:-60px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,.10)}
  .vhero .eyebrow{color:rgba(255,255,255,.85)}
  .vhero h1{color:#fff; margin-bottom:10px; position:relative}
  .vhero .role{color:rgba(255,255,255,.92); font-size:16.5px; line-height:1.6; margin:0; position:relative; max-width:60ch}
  .facts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:14px 0 22px}
  .fact{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow)}
  .fact .k{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:4px}
  .fact .v{font-weight:600; overflow-wrap:anywhere}
  .fact.wide{grid-column:1 / -1}
  .tabs{display:flex; gap:4px; overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .topic{font:inherit; font-size:15px; font-weight:600; cursor:pointer; border:0; background:none; color:var(--muted); border-radius:999px; padding:9px 16px; white-space:nowrap; flex:1 0 auto}
  .topic:hover{color:var(--accent)}
  .topic[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
  .topic-panel{margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px 20px; box-shadow:var(--shadow)}
  .plain{margin:0; padding:0; list-style:none}
  .plain li{position:relative; padding:6px 0 6px 28px; border-bottom:1px solid var(--line)}
  .plain li:last-child{border-bottom:0}
  .plain li::before{content:"✓"; position:absolute; left:0; top:6px; width:20px; height:20px; border-radius:50%; background:var(--ok-soft); color:var(--ok); font-size:12px; font-weight:700; display:grid; place-items:center}
  .steps{list-style:none; margin:0; padding:0; counter-reset:s}
  .steps li{counter-increment:s; position:relative; padding:2px 0 16px 42px; min-height:30px}
  .steps li::before{content:counter(s); position:absolute; left:0; top:0; width:28px; height:28px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:13px}
  .steps li::after{content:""; position:absolute; left:13px; top:30px; bottom:2px; width:2px; background:var(--line)}
  .steps li:last-child{padding-bottom:0} .steps li:last-child::after{display:none}
  .cta{position:sticky; bottom:14px; margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:16px 18px; box-shadow:0 14px 36px rgba(15,27,45,.16); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; z-index:2}
  .cta h2{margin:0}
  .cta p{margin:2px 0 0; color:var(--muted); font-size:14px}
  .cta .actions{margin:0}

  /* Pasos de postulación */
  .stepper{display:flex; gap:8px; margin:0 0 22px}
  .st{flex:1; font-size:12px; font-weight:600; color:var(--muted)}
  .st i{display:block; height:5px; border-radius:3px; background:var(--line); margin-bottom:6px}
  .st.on{color:var(--accent)} .st.on i{background:var(--accent)}
  .st.done i{background:var(--accent); opacity:.45}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:24px; padding:26px 22px; box-shadow:var(--shadow)}
  .panel h1{font-size:clamp(26px,6vw,34px)}
  .bigico{width:60px; height:60px; border-radius:18px; background:var(--accent-soft); display:grid; place-items:center; font-size:28px; margin-bottom:16px}
  .bigico.ok{background:var(--ok-soft)} .bigico.later{background:var(--warn-soft)}
  .infobox{background:var(--paper); border-radius:16px; padding:14px 16px; font-size:15px; color:var(--muted)}
  .infobox p:last-child{margin:0}
  .infobox a{color:var(--accent); font-weight:600}
  .switch{display:flex; gap:14px; align-items:center; margin-top:18px; cursor:pointer; font-weight:600}
  .switch input{appearance:none; -webkit-appearance:none; flex:none; width:48px; height:28px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; transition:background .2s; margin:0}
  .switch input::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s}
  .switch input:checked{background:var(--accent)}
  .switch input:checked::after{transform:translateX(20px)}
  .fld{display:block; font-weight:600; font-size:14px; margin:18px 0 6px}
  .inpw{position:relative}
  .inpw span{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:18px; pointer-events:none}
  .inp{width:100%; font:inherit; color:var(--ink); background:var(--paper); border:1.5px solid var(--line); border-radius:14px; padding:13px 14px 13px 46px; min-height:52px}
  .inp:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); background:var(--surface)}
  .err{color:var(--warn); background:var(--warn-soft); padding:10px 14px; border-radius:12px; margin-top:12px; font-size:15px}
  .hint{color:var(--muted); font-size:14px; margin-top:8px}
  .note{color:var(--muted); font-size:13px; margin-top:22px; text-align:center}

  /* Resultado */
  .result{text-align:center}
  .result .bigico{margin:0 auto 16px; width:76px; height:76px; border-radius:50%; font-size:36px}
  .result p{color:var(--muted)}
  .recs{display:grid; gap:10px; margin-top:20px; text-align:left}
  .rec{display:flex; align-items:center; gap:12px; text-decoration:none; background:var(--accent); color:var(--accent-ink); border-radius:16px; padding:12px 16px; font-weight:600; box-shadow:0 6px 16px rgba(31,79,255,.22); transition:transform .15s, filter .15s}
  .rec:hover{transform:translateY(-1px); filter:brightness(1.08)}
  .rec .ini{flex:none; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.22); display:grid; place-items:center; font-family:var(--display); font-weight:700}
  .rec .tx{flex:1}
  .rec small{display:block; font-weight:500; opacity:.85; font-size:13px}

  @media (prefers-reduced-motion: no-preference){
    .swap{animation:in .3s ease-out}
    @keyframes in{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  }
  @media (prefers-reduced-motion: reduce){ .sk{animation:none} }
  @media (max-width:440px){ .facts{grid-template-columns:1fr 1fr} .cta{flex-direction:column; align-items:stretch} .cta .actions{display:grid; grid-template-columns:1fr 1fr} .vac{gap:12px; padding:16px} .vac-ico{width:42px; height:42px; font-size:16px} }

  /* Preguntas tipo chat */
  .chat{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:14px 14px 16px}
  .chat-head{display:flex; align-items:center; gap:10px; padding:2px 2px 12px; border-bottom:1px solid var(--line); margin-bottom:6px}
  .cav{width:34px; height:34px; border-radius:50%; flex:none; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; position:relative}
  .chat-head .cav::after{content:""; position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; background:#1DB954; border:2px solid var(--surface)}
  .chat-head b{display:block; font-family:var(--display); font-size:16px; line-height:1.2}
  .chat-head span{font-size:13px; color:var(--muted)}
  .crow{display:flex; align-items:flex-end; gap:8px; margin-top:12px}
  .crow.cont{margin-top:4px}
  .crow .cav{width:28px; height:28px}
  .crow.cont .cav{visibility:hidden}
  .crow.me{justify-content:flex-end}
  .bub{max-width:82%; padding:10px 14px; border-radius:18px; overflow-wrap:anywhere}
  .bot .bub{background:var(--paper); border-bottom-left-radius:6px}
  .me .bub{background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:6px; white-space:pre-wrap}
  .bub small{display:block; color:var(--muted); font-size:14px; margin-top:4px}
  .bub .qn{display:inline-block; font-size:12px; font-weight:600; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 9px; margin-bottom:4px}
  .dots{display:inline-flex; gap:4px; padding:4px 2px}
  .dots i{width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.5; animation:bl 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{transform:none; opacity:.4} 30%{transform:translateY(-4px); opacity:1}}
  @media (prefers-reduced-motion: no-preference){ .crow.new{animation:in .25s ease-out} }
  @media (prefers-reduced-motion: reduce){ .dots i{animation:none} }
  .composer{margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
  .qrs{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end}
  .qr{font:inherit; cursor:pointer; background:var(--surface); color:var(--accent); border:1.5px solid var(--accent); border-radius:999px; padding:9px 18px; font-weight:600; min-height:44px}
  .qr:hover{background:var(--accent-soft)}
  .qrs.col{flex-direction:column; align-items:stretch}
  .qrs.col .qr{text-align:left; border-radius:14px}
  .bar{display:flex; gap:8px; align-items:flex-end}
  .field{flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--paper); border:1.5px solid var(--line); border-radius:22px; padding:11px 16px; min-height:46px}
  textarea.field{min-height:46px; resize:none; max-height:200px; line-height:1.45; border-radius:20px}
  .field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  select.field{flex:none; width:auto; cursor:pointer}
  .cur{flex:none; align-self:center; font-weight:700; font-size:14px; background:var(--accent-soft); border-radius:999px; padding:8px 12px}
  .send{flex:none; width:46px; height:46px; border-radius:50%; border:0; cursor:pointer; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center}
  .send:hover{filter:brightness(1.08)}
  .meta{display:flex; justify-content:space-between; gap:10px; align-items:center; margin-top:8px; min-height:18px}
  .undo{background:none; border:0; padding:0; cursor:pointer; color:var(--muted); font:inherit; font-size:13px; font-weight:600}
  .undo:hover{color:var(--accent)}
  .count{font-size:12px; color:var(--muted); margin-left:auto}
  .count.ok{color:var(--ok)}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></span><span>Reclutamiento</span></div>
    <span class="toppill">Trabaja con nosotros</span>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script src="config.js"></script>
<script>
/* ============================================================
   CONFIGURACIÓN: edita aquí
   ============================================================ */
const CFG = window.CONFIG || {};       // Se edita en config.js
const AGENDA_LINK = CFG.AGENDA_LINK || "";
const ENDPOINT = CFG.ENDPOINT || "";
const AVISO_URL = CFG.AVISO_URL || "";
const CONTACTO_TEXTO = "Un integrante del equipo de reclutamiento te atenderá. Escríbenos por el mismo canal por el que te contactamos.";

/* Las vacantes se cargan desde tu hoja de Google (se administran en admin.html).
   Esta lista solo se usa si ENDPOINT está vacío (modo prueba local). */
let VACANTES = [];
let carga = { estado: ENDPOINT ? "cargando" : "listo" };

const NIVELES_INGLES = ["A1 a B1", "B2", "B2+", "C1", "Nativo"];
const NIVELES_REQ = ["ninguno", "B2", "B2+", "C1", "Nativo"];
const nivelIdx = n => NIVELES_INGLES.indexOf(n);
const nPreg = v => arr(v && v.preguntas).length;
const fmtMonto = n => String(n == null ? "" : n).replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const MONEDAS = [
  { code: "COP", label: "Pesos colombianos (COP)", simbolo: "$", min: 300000, max: 100000000, ejemplo: "4.500.000" },
  { code: "USD", label: "Dólares (USD)", simbolo: "US$", min: 200, max: 50000, ejemplo: "1.500" },
  { code: "EUR", label: "Euros (EUR)", simbolo: "€", min: 200, max: 50000, ejemplo: "1.500" },
  { code: "MXN", label: "Pesos mexicanos (MXN)", simbolo: "MX$", min: 3000, max: 800000, ejemplo: "25.000" }
];
const monedaSimbolo = c => (MONEDAS.find(m => m.code === c) || MONEDAS[0]).simbolo;
const monedaInfo = c => MONEDAS.find(m => m.code === c) || MONEDAS[0];
const MIN_CARACTERES = 25;

/* ---------- Preguntas del prefiltro ----------
   Cada vacante trae su lista de preguntas desde admin.html. Tipos:
   texto (respuesta abierta), sino (Sí/No), opciones, ingles (nivel) y salario.
   Las vacantes creadas antes de este cambio usan las 5 preguntas de siempre. */
const TIPOS = ["texto", "sino", "opciones", "ingles", "salario"];
function preguntasPorDefecto(v){
  const ps = [
    { id: "exp", tipo: "texto", texto: "Cuéntanos sobre tu experiencia relacionada con este rol", ayuda: "Puedes mencionar cargos, funciones, herramientas o logros.", min: MIN_CARACTERES, palabras: arr(v.palabrasClave) },
    { id: "full", tipo: "sino", texto: "¿Tienes disponibilidad de tiempo completo?", ayuda: "", pasa: "Sí" },
    { id: "viaje", tipo: "sino", texto: "¿Tienes algún viaje planeado próximamente?", ayuda: "", pasa: "No" }
  ];
  if(v.inglesMin !== "ninguno") ps.push({ id: "ingles", tipo: "ingles", texto: "¿Cuál es tu nivel de inglés?", ayuda: "Elige el que mejor te describa.", min: NIVELES_REQ.includes(v.inglesMin) ? v.inglesMin : "B2+" });
  ps.push({ id: "salario", tipo: "salario", texto: "¿Cuál es tu expectativa salarial?", ayuda: "", tope: v.salarioMax, moneda: v.monedaSalarioMax });
  return ps;
}
function normPregunta(p, i){
  p = p || {};
  const tipo = TIPOS.includes(p.tipo) ? p.tipo : "texto";
  const q = { id: String(p.id || ("q" + i)), tipo, texto: String(p.texto || "").trim(), ayuda: String(p.ayuda || "").trim() };
  if(tipo === "texto"){
    q.min = Math.max(0, Math.min(500, parseInt(p.min, 10) || 0));
    q.palabras = arr(p.palabras).map(k => norm(String(k)).trim()).filter(Boolean);
  } else if(tipo === "sino"){
    q.pasa = ["Sí", "No"].includes(p.pasa) ? p.pasa : "cualquiera";
  } else if(tipo === "opciones"){
    q.opciones = arr(p.opciones).map(x => String(x).trim()).filter(Boolean);
    q.aprobadas = arr(p.aprobadas).map(String).filter(x => q.opciones.includes(x));
  } else if(tipo === "ingles"){
    q.min = NIVELES_REQ.includes(p.min) ? p.min : "B2+";
  } else if(tipo === "salario"){
    q.tope = Number(String(p.tope == null ? "" : p.tope).replace(/\D/g, "")) || 0;
    q.moneda = MONEDAS.some(m => m.code === p.moneda) ? p.moneda : "COP";
  }
  return q;
}
const preguntaValida = q => q.texto && (q.tipo !== "opciones" || q.opciones.length >= 2);
function pasaPregunta(q, r){
  if(q.tipo === "texto"){
    const t = norm(String(r || ""));
    return t.trim().length >= q.min && (q.palabras.length === 0 || q.palabras.some(k => t.includes(k)));
  }
  if(q.tipo === "sino") return q.pasa === "cualquiera" || r === q.pasa;
  if(q.tipo === "opciones") return q.aprobadas.length === 0 || q.aprobadas.includes(r);
  if(q.tipo === "ingles") return q.min === "ninguno" || nivelIdx(r) >= nivelIdx(q.min);
  if(q.tipo === "salario"){
    const pide = Number(String((r && r.monto) || "").replace(/\D/g, "")) || 0;
    return !(q.tope > 0 && r && r.moneda === q.moneda && pide > q.tope);
  }
  return true;
}
function textoRespuesta(q, r){
  if(q.tipo === "salario") return r && r.monto ? `${r.moneda} ${fmtMonto(r.monto)}` : "";
  return String(r == null ? "" : r).trim();
}

function vPregunta(){
  const v = vacById(state.vacId), ps = arr(v.preguntas), n = ps.length, s = state.step, q = ps[s], r = state.ans[q.id];
  const nombre = esc(state.datos.nombre.trim().split(/\s+/)[0]);
  // Conversación: preguntas ya respondidas + la actual
  const filas = [];
  const bot = (html, cls = "") => filas.push({ who: "bot", html, cls });
  bot(`¡Hola${nombre ? ", " + nombre : ""}! 👋 Te haré ${n === 1 ? "una pregunta rápida" : n + " preguntas rápidas"} para ver si tu perfil encaja.`);
  for(let i = 0; i < s; i++){
    bot(burbujaPregunta(ps[i], i, n));
    filas.push({ who: "me", html: esc(respuestaVisible(ps[i], state.ans[ps[i].id])) });
  }
  if(state.escribiendo) bot(`<span class="dots" aria-label="Escribiendo"><i></i><i></i><i></i></span>`, "new");
  else bot(burbujaPregunta(q, s, n), "new");
  const html = filas.map((f, i) => {
    const cont = i > 0 && filas[i - 1].who === f.who;
    return `<div class="crow ${f.who}${cont ? " cont" : ""} ${f.cls || ""}">${f.who === "bot" ? CAV : ""}<div class="bub">${f.html}</div></div>`;

    const opcion = val => `<button class="qr" data-a="ans" data-v="${esc(val)}">${esc(val)}</button>`;
    if(q.tipo === "texto"){
      comp = `<div class="bar"><textarea class="field" id="txt" rows="1" maxlength="1200" placeholder="Escribe tu respuesta…" aria-label="Tu respuesta">${esc(r || "")}</textarea>
        <button class="send" data-a="next" aria-label="Enviar">${SEND}</button></div>${err}${meta}`;
    } else if(q.tipo === "sino"){
      comp = `<div class="qrs">${opcion("Sí")}${opcion("No")}</div>${meta}`;
    } else if(q.tipo === "opciones"){
      comp = `<div class="qrs${q.opciones.some(o => o.length > 28) ? " col" : ""}">${q.opciones.map(opcion).join("")}</div>${meta}`;
    } else if(q.tipo === "ingles"){
      comp = `<div class="qrs">${NIVELES_INGLES.map(opcion).join("")}</div>${meta}`;

        : `<select class="field" id="moneda" aria-label="Moneda">${MONEDAS.map(m => `<option value="${m.code}" ${state.moneda === m.code ? "selected" : ""}>${m.code}</option>`).join("")}</select>`;
      const monto = r && r.monto ? r.monto : "";
      comp = `<div class="bar">${mon}<input class="field" type="text" id="salario" inputmode="numeric" autocomplete="off" placeholder="Monto mensual, ej. ${monedaInfo(fija ? q.moneda : state.moneda).ejemplo}" value="${fmtMonto(monto)}" aria-label="Expectativa salarial mensual">

  }
  return `<div class="swap">${s === 0 ? back("vac-page", "Volver a la vacante") : ""}${stepper(3)}

    const v0 = vacById(state.vacId) || {};
    const recs = arr(v0.reclutadores);
    const boton = (link, nombre, sub) => `<a class="rec" href="${link}" target="_blank" rel="noopener"><span class="ini" aria-hidden="true">${nombre ? iniciales(nombre.replace(/&[^;]+;/g, "")) : "📅"}</span><span class="tx">${nombre ? "Agendar con " + nombre : "Agendar mi entrevista"}<small>${sub}</small></span>${ARROW}</a>`;
    let cta;
    if(recs.length > 1){
      cta = `<p>Ya recibimos tus datos. Agenda con uno de nuestros ${recs.length} reclutadores (de preferencia con quien te contactó).</p>
        <div class="recs">${recs.map(r => boton(r.link, r.nombre, "Elige el horario que te quede mejor")).join("")}</div>`;
    } else if(recs.length === 1){
      cta = `<p>Ya recibimos tus datos. Da el siguiente paso y agenda tu entrevista con ${recs[0].nombre}.</p>
        <div class="recs">${boton(recs[0].link, recs[0].nombre, "Elige el horario que te quede mejor")}</div>`;
    } else if(AGENDA_LINK){
      cta = `<p>Ya recibimos tus datos. Da el siguiente paso y agenda tu entrevista con el equipo de reclutamiento.</p>
        <div class="recs">${boton(esc(AGENDA_LINK), "", "Elige el horario que te quede mejor")}</div>`;
    } else {
      cta = `<p>Ya recibimos tus datos. El equipo de reclutamiento te escribirá al correo que nos dejaste para coordinar la entrevista.</p>`;
    }
    return `<div class="swap"><div class="panel result"><div class="bigico ok">🎉</div>
      <h1 tabindex="-1">¡Genial! Tu perfil encaja</h1>${cta}</div>
      <div class="actions" style="justify-content:center"><button class="btn" data-a="home">Volver al inicio</button></div></div>`;
  }
  return `<div class="swap"><div class="panel result"><div class="bigico later">💙</div>
    <h1 tabindex="-1">Gracias por postularte</h1>
    <p>Recibimos tu información. Revisaremos tu perfil y nos pondremos en contacto contigo.</p>
    <div class="actions" style="justify-content:center"><button class="btn solid" data-a="home">Ver otras vacantes</button></div></div></div>`;
}

function enviarResultado(payload){
  if(!ENDPOINT) return;
  try{
    fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).catch(() => {});
  }catch(e){}
}

const VIEWS = { home: vHome, vac: vVac, consent: vConsent, datos: vDatos, nointeres: vNoInteres, pregunta: vPregunta, resultado: vResultado };

function render(){
  $app.innerHTML = VIEWS[state.view]();
  if(state.view === "pregunta"){
    const campo = document.getElementById("txt") || document.getElementById("salario");
    if(campo){ campo.focus({ preventScroll: true }); if(campo.id === "txt"){ autosize(campo); contar(); } }
    else { const h1 = $app.querySelector("h1"); if(h1) h1.focus({ preventScroll: true }); }
    window.scrollTo({ top: document.documentElement.scrollHeight });
    return;
  }
  const h1 = $app.querySelector("h1");
  if(h1){ h1.focus({ preventScroll: true }); }
  window.scrollTo({ top: 0 });
}

function finalizar(){
  const v = vacById(state.vacId), a = state.ans, ps = arr(v.preguntas);
  const fallidas = preguntasFallidas();
  const primera = tipo => ps.find(q => q.tipo === tipo);
  const resp = q => q ? textoRespuesta(q, a[q.id]) : "";
  const pIngles = primera("ingles"), pSal = primera("salario");
  const pExp = ps.find(q => q.id === "exp") || primera("texto");
  const sal = pSal ? (a[pSal.id] || {}) : {};
  state.view = "resultado"; render();
  enviarResultado({
    tipo: "resultado", fecha: new Date().toISOString(), vacanteId: v.id, vacante: v.nombreRaw,
    pasa: fallidas.length === 0, fallas: fallidas.map(q => q.texto.length > 80 ? q.texto.slice(0, 77) + "…" : q.texto),
    respuestas: ps.map(q => ({ pregunta: q.texto, respuesta: resp(q) })),
    tiempoCompleto: resp(ps.find(q => q.id === "full")), viaje: resp(ps.find(q => q.id === "viaje")),
    ingles: pIngles ? resp(pIngles) : "No aplica",
    nombre: state.datos.nombre.trim(), correo: state.datos.correo.trim(), experiencia: resp(pExp),
    expectativaSalarial: Number(String(sal.monto || "").replace(/\D/g, "")) || 0, monedaSalarial: sal.moneda || ""
  });
}

function reiniciarFiltro(){
  const v = vacById(state.vacId);
  const pSal = arr(v && v.preguntas).find(q => q.tipo === "salario");
  state.step = 0; state.err = ""; state.ans = {};
  state.moneda = pSal && pSal.tope > 0 ? pSal.moneda : "COP";
  state.datos = { nombre: "", correo: "" };
}

function avanzar(){
  if(state.step < nPreg(vacById(state.vacId)) - 1){ state.step += 1; mostrarPregunta(); } else { finalizar(); }
}

$app.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  const act = el.dataset.a;
  if(act === "home"){ state.view = "home"; render(); }
  else if(act === "reintentar"){ cargarVacantes(); }
  else if(act === "vac"){ state.vacId = el.dataset.id; state.tema = null; state.view = "vac"; render(); }
  else if(act === "vac-page"){ state.view = "vac"; render(); }
  else if(act === "chip"){
    state.tema = el.dataset.id;
    document.querySelectorAll(".topic").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === state.tema)));
    document.getElementById("topicPanel").innerHTML = temaContenido(state.tema, vacById(state.vacId));
  }
  else if(act === "filtro"){ state.view = "consent"; render(); }
  else if(act === "acepto"){ reiniciarFiltro(); state.view = "datos"; render(); }
  else if(act === "datos-ok"){
    const n = state.datos.nombre.trim(), c = state.datos.correo.trim();
    if(n.length < 3){ state.err = "Escribe tu nombre completo."; return render(); }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c)){ state.err = "Escribe un correo válido, por ejemplo nombre@correo.com."; return render(); }
    state.err = ""; state.step = 0;
    if(nPreg(vacById(state.vacId)) === 0) return finalizar();
    mostrarPregunta();
  }
  else if(act === "no-acepto"){ state.view = "nointeres"; render(); }
  else if(act === "no-interes"){
    const v = vacById(state.vacId);
    enviarResultado({ tipo: "no_interes", fecha: new Date().toISOString(), vacanteId: v.id, vacante: v.nombreRaw });
    state.view = "nointeres"; render();
  }
  else if(act === "prev"){ state.step = Math.max(0, state.step - 1); state.err = ""; render(); }
  else if(act === "next"){
    const q = preguntaActual();
    const txt = ((document.getElementById("txt") || {}).value || state.ans[q.id] || "");
    state.ans[q.id] = txt;
    const minimo = Math.max(1, q.min);
    if(txt.trim().length < minimo){ state.err = minimo > 1 ? "Cuéntanos un poco más para poder evaluar tu perfil." : "Escribe tu respuesta para continuar."; return render(); }
    state.err = ""; avanzar();
  }
  else if(act === "ans"){
    state.ans[preguntaActual().id] = el.dataset.v;
    avanzar();
  }
  else if(act === "salario-ok"){
    const q = preguntaActual();
    const inp = document.getElementById("salario");
    const digitos = ((inp ? inp.value : "") || "").replace(/\D/g, "");
    const moneda = q.tope > 0 ? q.moneda : state.moneda;
    state.ans[q.id] = { monto: digitos, moneda };
    const n = Number(digitos);
    const m = monedaInfo(moneda);
    if(!(n >= m.min && n <= m.max)){ state.err = `Escribe tu expectativa mensual completa en ${m.code}, por ejemplo ${m.ejemplo}.`; return render(); }
    state.err = "";
    avanzar();
  }
});

$app.addEventListener("input", e => {
  if(e.target.id === "nombre") state.datos.nombre = e.target.value;
  if(e.target.id === "correo") state.datos.correo = e.target.value;
  if(e.target.id === "salario"){
    const d = e.target.value.replace(/\D/g, "").slice(0, 10);
    e.target.value = fmtMonto(d);
  }
  if(e.target.id === "txt"){ const q = preguntaActual(); if(q) state.ans[q.id] = e.target.value; autosize(e.target); contar(); }
});

$app.addEventListener("change", e => {
  if(e.target.id === "okDatos"){ document.getElementById("btnAcepto").disabled = !e.target.checked; }
  if(e.target.id === "moneda"){
    state.moneda = e.target.value;
    const f = document.getElementById("salario");
    if(f) f.placeholder = "Monto mensual, ej. " + monedaInfo(state.moneda).ejemplo;
  }
});

// Enter envía el salario; en respuestas abiertas Ctrl/⌘ + Enter envía (Enter solo hace salto de línea)
$app.addEventListener("keydown", e => {
  if(e.key !== "Enter" || e.isComposing) return;
  if(e.target.id === "salario"){ e.preventDefault(); const b = $app.querySelector('[data-a="salario-ok"]'); if(b) b.click(); }
  else if(e.target.id === "txt" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); const b = $app.querySelector('[data-a="next"]'); if(b) b.click(); }
});

render();
cargarVacantes();
</script>
</body>
</html>
