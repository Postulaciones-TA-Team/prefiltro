<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrar vacantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2F7; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4E5D72; --line:#D3DAE5;
    --accent:#1F4FFF; --accent-ink:#FFFFFF; --accent-soft:#E3EAFF;
    --ok:#0F7B55; --ok-soft:#DDF3EA; --warn:#7A5000; --warn-soft:#FFF0CC;
    --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
    --body:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
      --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
      --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
    --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
    --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55}
  .wrap{max-width:720px; margin:0 auto; padding:20px 20px 64px}
  h1{font-family:var(--display); font-weight:700; font-size:clamp(28px,6vw,38px); line-height:1.1; letter-spacing:-.02em; margin:8px 0 8px}
  h1:focus{outline:none}
  h2{font-family:var(--display); font-weight:700; font-size:19px; margin:0 0 8px}
  .lead{color:var(--muted); margin:0 0 24px}
  label{display:block; font-weight:600; font-size:14px; margin:18px 0 6px}
  .hint{color:var(--muted); font-size:13px; font-weight:400; margin:4px 0 0}
  input[type=text],input[type=password],textarea,select{
    width:100%; font:inherit; color:var(--ink); background:var(--surface);
    border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
  }
  textarea{min-height:88px; resize:vertical}
  input:focus,textarea:focus,select:focus{outline:3px solid var(--accent); outline-offset:2px; border-color:var(--accent)}
  .btn{font:inherit; font-weight:600; cursor:pointer; border-radius:12px; padding:12px 18px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); min-height:46px}
  .btn:hover{background:var(--accent-soft); border-color:var(--accent)}
  .btn.solid{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.small{min-height:38px; padding:7px 14px; font-size:14px}
  .btn[disabled]{opacity:.55; cursor:default}
  .actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
  :focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:6px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:12px}
  .vrow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .vrow h2{margin:0}
  .chip{font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px}
  .chip.on{background:var(--ok-soft); color:var(--ok)}
  .chip.off{background:var(--warn-soft); color:var(--warn)}
  .chip.falta{background:var(--warn-soft); color:var(--warn)}
  .linkbox{margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}
  .url{word-break:break-all; color:var(--muted); font-size:13px; margin:10px 0 0}
  .aviso{color:var(--warn); margin:10px 0 0}
  .btns{display:flex; gap:8px; flex-wrap:wrap}
  .msg{padding:12px 16px; border-radius:12px; margin:16px 0; font-size:15px}
  .msg.ok{background:var(--ok-soft); color:var(--ok)}
  .msg.err{background:var(--warn-soft); color:var(--warn)}
  .msg.info{background:var(--accent-soft)}
  a{color:var(--accent)}
  summary{cursor:pointer; font-weight:600; margin-top:10px}
  details p{margin:8px 0 0; font-size:15px}
  .linkback{background:none; border:0; padding:6px 0; font:inherit; font-weight:600; color:var(--muted); cursor:pointer}
  .linkback:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <main id="app"></main>
</div>

<script src="config.js"></script>
<script>
/* La URL del Apps Script se configura en config.js */
const ENDPOINT = (window.CONFIG || {}).ENDPOINT || "";

const CAMPOS_LISTA = ["sedes", "beneficios", "etapas", "requisitos"];
let lista = [], clave = "", editando = null, mensaje = null, guardando = false, cargando = true;
let linkAbierto = null, linkBorrador = "", bulkAbierto = false, bulkBorrador = "";
let verPost = false, postulantes = [], postCargando = false, postError = "", filtroPostVac = "todas", filtroPostEst = "todos";
try{ clave = sessionStorage.getItem("clave_admin") || ""; }catch(e){}

const $app = document.getElementById("app");
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const quitaTildes = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const slug = s => quitaTildes(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "vacante";

async function traer(){
  const r = await fetch(ENDPOINT + "?accion=vacantes&t=" + Date.now());
  const j = await r.json();
  return j.vacantes || [];
}

async function cargar(){
  if(!ENDPOINT){ cargando = false; return render(); }
  cargando = true; render();
  try{ lista = await traer(); mensaje = null; }
  catch(e){ mensaje = { t: "err", x: "No se pudieron cargar las vacantes. Revisa la URL del script y que esté publicado para «Cualquier persona»." }; }
  cargando = false; render();
}

/* Envía la vacante. Primero intenta leer la respuesta del script para saber el motivo exacto;
   si el navegador no lo permite, envía igual y confirma leyendo la hoja. */
async function enviar(v){
  const cuerpo = JSON.stringify({ tipo: "vacante_guardar", clave, vacante: v });
  const cab = { "Content-Type": "text/plain;charset=utf-8" };
  try{
    const r = await fetch(ENDPOINT, { method: "POST", headers: cab, body: cuerpo });
    return await r.json();
  }catch(e){}
  try{ await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: cab, body: cuerpo }); }catch(e){}
  return null;
}

const MOTIVOS = {
  clave: "La clave no coincide con la que pusiste en el script (CLAVE_ADMIN). Revisa mayúsculas y espacios.",
  clave_por_defecto: "En el script todavía está la clave de ejemplo («cambia-esta-clave»). Cámbiala, guarda y publica una versión nueva (Implementar > Administrar implementaciones > lápiz > Versión: Nueva versión).",
  id: "La vacante no tiene identificador. Escribe un nombre e intenta de nuevo."
};

/* Para confirmar que la escritura llegó comparamos solo los campos de texto simple:
   la hoja los devuelve idénticos a como se enviaron. Las listas quedan fuera a propósito,
   porque el script las guarda unidas por saltos de línea y una diferencia de formato haría
   que un guardado correcto pareciera fallido. */
const CAMPOS_FIRMA = ["nombre", "estado", "descripcion", "salario", "horario", "modalidad", "tiempos", "inglesMin", "linkAgenda"];
const firma = v => JSON.stringify(CAMPOS_FIRMA.map(c => String(v[c] == null ? "" : v[c]).trim()));

async function guardarVacante(v){
  guardando = true; mensaje = { t: "info", x: "Guardando…" }; render();
  const j = await enviar(v);
  if(j && j.ok === false){
    guardando = false;
    return { ok: false, razon: MOTIVOS[j.error] || ("El script rechazó el guardado (" + j.error + ").") };
  }
  const esperas = [400, 700, 1200, 1800, 2500, 3500];
  try{
    for(const ms of esperas){
      await sleep(ms);
      const nueva = await traer();
      const g = nueva.find(x => x.id === v.id);
      if(g && firma(g) === firma(v)){ lista = nueva; guardando = false; return { ok: true }; }
    }
  }catch(e){}
  guardando = false;
  return { ok: false, razon: "El cambio no aparece todavía en la hoja, así que no podemos confirmarlo. Abre la pestaña «Vacantes»: si el cambio está, sí se guardó y basta con actualizar esta página. Si no está, vuelve a intentarlo." };
}

const vacio = () => ({ id: "", estado: "Activa", nombre: "", descripcion: "", sedes: [], salario: "", beneficios: [], horario: "", modalidad: "", etapas: [], tiempos: "", requisitos: [], palabrasClave: [], linkAgenda: "", inglesMin: "B2+", responsabilidades: [] });

const sinLink = v => v.estado === "Activa" && !v.linkAgenda;

function editorLink(v){
  return `<div class="linkbox">
    <label class="hint" style="display:block;margin:0 0 6px">Link de agendamiento. Debe empezar con https://</label>
    <input class="lk" type="text" value="${esc(linkBorrador)}" placeholder="https://calendly.com/tu-usuario/entrevista" aria-label="Link de agendamiento de ${esc(v.nombre)}">
    <div class="btns" style="margin-top:10px">
      <button class="btn small solid" data-a="link-guardar" data-id="${esc(v.id)}" ${guardando ? "disabled" : ""}>Guardar link</button>
      ${v.linkAgenda ? `<button class="btn small" data-a="link-quitar" data-id="${esc(v.id)}" ${guardando ? "disabled" : ""}>Quitar</button>` : ""}
      <button class="btn small" data-a="link-cancelar" ${guardando ? "disabled" : ""}>Cancelar</button>
    </div></div>`;
}

function filaVacante(v){
  const falta = sinLink(v);
  return `<div class="card"><div class="vrow">
      <div><h2>${esc(v.nombre)}</h2><span class="chip ${v.estado === "Activa" ? "on" : "off"}">${esc(v.estado)}</span>${falta ? ` <span class="chip falta">Sin link de agendamiento</span>` : ""}</div>
      <div class="btns">
        <button class="btn small" data-a="link" data-id="${esc(v.id)}">${v.linkAgenda ? "Cambiar link" : "Poner link"}</button>
        <button class="btn small" data-a="editar" data-id="${esc(v.id)}">Editar</button>
        <button class="btn small" data-a="toggle" data-id="${esc(v.id)}">${v.estado === "Activa" ? "Cerrar" : "Reabrir"}</button>
      </div></div>
    ${falta ? `<p class="hint aviso">Quien pase el prefiltro no podrá agendar: solo verá un aviso de que el enlace estará disponible pronto.</p>` : ""}
    ${linkAbierto === v.id ? editorLink(v) : (v.linkAgenda ? `<p class="url">${esc(v.linkAgenda)}</p>` : "")}</div>`;
}

function cajaBulk(n){
  if(!bulkAbierto) return "";
  return `<div class="card"><h2>Poner el mismo link en todas</h2>
    <p class="hint" style="margin:6px 0 10px">Se aplicará a las ${n} vacantes activas que hoy no tienen link. Las que ya tienen uno propio no se tocan.</p>
    <input class="bulk" type="text" value="${esc(bulkBorrador)}" placeholder="https://calendly.com/tu-usuario/entrevista" aria-label="Link de agendamiento para todas las vacantes sin link">
    <div class="btns" style="margin-top:10px">
      <button class="btn small solid" data-a="bulk-aplicar" ${guardando ? "disabled" : ""}>Aplicar a las ${n}</button>
      <button class="btn small" data-a="bulk" ${guardando ? "disabled" : ""}>Cancelar</button>
    </div></div>`;
}

function vLista(){
  if(!ENDPOINT) return `<div class="msg err">Falta pegar la URL del Apps Script en el archivo config.js.</div>`;
  const faltantes = lista.filter(sinLink).length;
  const filas = lista.length ? lista.map(filaVacante).join("")
    : (cargando ? `<p class="lead">Cargando…</p>` : `<div class="card"><p style="margin:0;color:var(--muted)">Todavía no hay vacantes. Crea la primera.</p></div>`);
  return `<h1 tabindex="-1">Administrar vacantes</h1>
    <p class="lead">Crea, edita y cierra las vacantes que ven los candidatos. Los cambios se reflejan al instante en la página pública.</p>
    <label for="clave">Clave de administrador</label>
    <input type="password" id="clave" value="${esc(clave)}" autocomplete="off">
    <p class="hint">La clave es la que pusiste en CLAVE_ADMIN dentro del Apps Script.</p>
    ${mensaje ? `<div class="msg ${mensaje.t}" role="status">${esc(mensaje.x)}</div>` : ""}
    ${faltantes && !bulkAbierto ? `<div class="msg err" role="status">${faltantes === 1 ? "Hay 1 vacante activa sin link de agendamiento." : `Hay ${faltantes} vacantes activas sin link de agendamiento.`} Quien pase el prefiltro no podrá agendar entrevista.</div>` : ""}
    <div class="actions" style="margin:20px 0"><button class="btn solid" data-a="nueva">Nueva vacante</button><button class="btn" data-a="postulantes">Ver postulantes</button>${faltantes > 1 ? `<button class="btn" data-a="bulk">Poner el mismo link en todas</button>` : ""}</div>
    ${cajaBulk(faltantes)}
    ${filas}`;
}

async function aplicarLinkATodas(url){
  const objetivo = lista.filter(sinLink);
  guardando = true; mensaje = { t: "info", x: `Aplicando el link a ${objetivo.length} vacante(s)…` }; render();
  let rechazo = null;
  for(const v of objetivo){
    const j = await enviar(Object.assign(vacio(), v, { linkAgenda: url }));
    if(j && j.ok === false){ rechazo = MOTIVOS[j.error] || ("El script rechazó el guardado (" + j.error + ")."); break; }
  }
  guardando = false;
  if(rechazo){ mensaje = { t: "err", x: rechazo }; return render(); }
  await cargar();
  const faltan = lista.filter(sinLink).length;
  bulkAbierto = false; bulkBorrador = "";
  mensaje = faltan
    ? { t: "err", x: `Quedaron ${faltan} vacante(s) sin link. Vuelve a intentarlo o ponlas una por una.` }
    : { t: "ok", x: `Link aplicado a ${objetivo.length} vacante(s).` };
  render();
}

function campoLista(id, label, valor, hint){
  return `<label for="${id}">${label}</label><textarea id="${id}">${esc((valor || []).join("\n"))}</textarea>${hint ? `<p class="hint">${hint}</p>` : ""}`;
}

function vForm(){
  const v = editando;
  return `<button class="linkback" data-a="cancelar">← Volver a la lista</button>
    <h1 tabindex="-1">${v.id ? "Editar vacante" : "Nueva vacante"}</h1>
    <label for="f_nombre">Nombre de la vacante *</label>
    <input type="text" id="f_nombre" value="${esc(v.nombre)}">
    <label for="f_estado">Estado</label>
    <select id="f_estado"><option ${v.estado === "Activa" ? "selected" : ""}>Activa</option><option ${v.estado === "Cerrada" ? "selected" : ""}>Cerrada</option></select>
    <p class="hint">Solo las vacantes «Activa» las ven los candidatos.</p>
    <label for="f_descripcion">Descripción corta</label>
    <textarea id="f_descripcion">${esc(v.descripcion)}</textarea>
    ${campoLista("f_responsabilidades", "Responsabilidades", v.responsabilidades, "Una por línea. Es lo que hará la persona en el día a día.")}
    ${campoLista("f_sedes", "Sedes / ciudades", v.sedes, "Una por línea. Ej: Medellín (Edificio Camacol)")}
    <label for="f_salario">Salario</label>
    <input type="text" id="f_salario" value="${esc(v.salario)}" placeholder="$7.000.000 COP">
    ${campoLista("f_beneficios", "Beneficios", v.beneficios, "Uno por línea.")}
    <label for="f_horario">Horario</label>
    <input type="text" id="f_horario" value="${esc(v.horario)}" placeholder="Lunes a viernes, 8:00 a.m. a 6:00 p.m.">
    <label for="f_modalidad">Modalidad</label>
    <input type="text" id="f_modalidad" value="${esc(v.modalidad)}" placeholder="Presencial, híbrida o remota">
    ${campoLista("f_etapas", "Etapas del proceso", v.etapas, "Una por línea, en orden.")}
    <label for="f_tiempos">Tiempos estimados</label>
    <input type="text" id="f_tiempos" value="${esc(v.tiempos)}" placeholder="1 a 2 semanas">
    ${campoLista("f_requisitos", "Requisitos", v.requisitos, "Uno por línea.")}
    <label for="f_palabrasClave">Palabras clave de experiencia</label>
    <input type="text" id="f_palabrasClave" value="${esc((v.palabrasClave || []).join(", "))}" placeholder="bpo, clientes, kpis, supervisores">
    <p class="hint">Separadas por coma. El prefiltro las busca en la respuesta de experiencia del candidato. Si las dejas vacías, solo revisa que la respuesta tenga suficiente texto.</p>
    <label for="f_inglesMin">Nivel de inglés requerido</label>
    <select id="f_inglesMin">
      ${[["ninguno","No se requiere inglés"],["B2","B2 o superior"],["B2+","B2+ o superior"],["C1","C1 o superior"],["Nativo","Nativo"]].map(([k,t]) => `<option value="${k}" ${(v.inglesMin || "B2+") === k ? "selected" : ""}>${t}</option>`).join("")}
    </select>
    <p class="hint">Si eliges «No se requiere inglés», el prefiltro no le hace esa pregunta al candidato.</p>
    <label for="f_linkAgenda">Link de agendamiento (opcional)</label>
    <input type="text" id="f_linkAgenda" value="${esc(v.linkAgenda)}" placeholder="https://...">
    <p class="hint">Si lo dejas vacío, se usa el link general de index.html. Debe empezar con https://</p>
    <label for="f_clave2">Clave de administrador</label>
    <input type="password" id="f_clave2" value="${esc(clave)}" autocomplete="off">
    ${mensaje ? `<div class="msg ${mensaje.t}" role="status">${esc(mensaje.x)}</div>` : ""}
    <div class="actions"><button class="btn solid" data-a="guardar" ${guardando ? "disabled" : ""}>Guardar vacante</button>
      <button class="btn" data-a="cancelar">Cancelar</button></div>`;
}

async function cargarPostulantes(){
  postCargando = true; postError = ""; render();
  try{
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ tipo: "postulantes_listar", clave }) });
    const j = await r.json();
    if(j.ok){ postulantes = j.postulantes || []; }
    else { postError = MOTIVOS[j.error] || ("El script rechazó la consulta (" + j.error + ")."); }
  }catch(e){
    postError = "No se pudieron cargar desde aquí. Puedes verlos directamente en la pestaña «Postulantes» de tu hoja de Google.";
  }
  postCargando = false; render();
}

function vPostulantes(){
  const vacs = [...new Set(postulantes.map(p => p.vacante))].filter(Boolean);
  const vis = postulantes.filter(p => (filtroPostVac === "todas" || p.vacante === filtroPostVac) && (filtroPostEst === "todos" || p.estado === filtroPostEst));
  const aptos = postulantes.filter(p => p.estado === "Apto").length;
  const cuerpo = postCargando ? `<p class="lead">Cargando postulantes…</p>`
    : postError ? `<div class="msg err" role="alert">${esc(postError)}</div>`
    : !postulantes.length ? `<div class="card"><p style="margin:0;color:var(--muted)">Todavía no hay postulantes.</p></div>`
    : `<p class="hint" style="margin:12px 0 16px">${vis.length} de ${postulantes.length} postulantes (${aptos} aptos recibieron el link de entrevista).</p>` +
      vis.map(p => `<div class="card"><div class="vrow">
        <div><h2>${esc(p.nombre)}</h2><a href="mailto:${esc(p.correo)}">${esc(p.correo)}</a></div>
        <span class="chip ${p.estado === "Apto" ? "on" : "off"}">${esc(p.estado)}</span></div>
        <p class="hint" style="margin-top:8px">${esc(isNaN(new Date(p.fecha)) ? p.fecha : new Date(p.fecha).toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" }))}, ${esc(p.vacante)}</p>
        <details><summary>Ver respuestas</summary>
          <p><strong>Tiempo completo:</strong> ${esc(p.tiempoCompleto)}. <strong>Viaje planeado:</strong> ${esc(p.viaje)}. <strong>Inglés:</strong> ${esc(p.ingles)}.</p>
          ${p.fallas ? `<p><strong>No cumple:</strong> ${esc(p.fallas)}</p>` : ""}
          <p><strong>Experiencia:</strong> ${esc(p.experiencia)}</p></details></div>`).join("");
  return `<button class="linkback" data-a="volver-lista">← Volver a las vacantes</button>
    <h1 tabindex="-1">Postulantes</h1>
    <p class="lead" style="margin-bottom:12px">Quienes completaron el prefiltro. «Apto» recibió el link de agendamiento; «En revisión» solo vio un mensaje de que se les contactará.</p>
    <div class="vrow" style="gap:12px;margin-bottom:8px">
      <select id="fp_vac" aria-label="Filtrar por vacante" style="flex:1;min-width:180px"><option value="todas">Todas las vacantes</option>${vacs.map(v => `<option value="${esc(v)}" ${filtroPostVac === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
      <select id="fp_est" aria-label="Filtrar por estado" style="flex:1;min-width:140px"><option value="todos">Todos</option><option ${filtroPostEst === "Apto" ? "selected" : ""}>Apto</option><option ${filtroPostEst === "En revisión" ? "selected" : ""}>En revisión</option></select>
      <button class="btn small" data-a="refrescar">Actualizar</button>
    </div>
    ${cuerpo}`;
}

function render(){
  $app.innerHTML = editando ? vForm() : (verPost ? vPostulantes() : vLista());
}

const val = id => (document.getElementById(id) || {}).value || "";
const lineas = id => val(id).split("\n").map(x => x.trim()).filter(Boolean);

function leerForm(){
  const v = Object.assign({}, editando);
  v.nombre = val("f_nombre").trim();
  v.estado = val("f_estado") === "Cerrada" ? "Cerrada" : "Activa";
  v.descripcion = val("f_descripcion").trim();
  v.responsabilidades = lineas("f_responsabilidades");
  v.sedes = lineas("f_sedes");
  v.salario = val("f_salario").trim();
  v.beneficios = lineas("f_beneficios");
  v.horario = val("f_horario").trim();
  v.modalidad = val("f_modalidad").trim();
  v.etapas = lineas("f_etapas");
  v.tiempos = val("f_tiempos").trim();
  v.requisitos = lineas("f_requisitos");
  v.palabrasClave = val("f_palabrasClave").split(",").map(x => quitaTildes(x.trim().toLowerCase())).filter(Boolean);
  v.inglesMin = val("f_inglesMin") || "B2+";
  v.linkAgenda = val("f_linkAgenda").trim();
  return v;
}

function idNuevo(nombre){
  const base = slug(nombre); let id = base, n = 2;
  while(lista.some(x => x.id === id)){ id = base + "-" + n++; }
  return id;
}

function guardarClave(c){ clave = c; try{ sessionStorage.setItem("clave_admin", c); }catch(e){} }

$app.addEventListener("change", e => {
  if(e.target.id === "fp_vac"){ filtroPostVac = e.target.value; render(); }
  if(e.target.id === "fp_est"){ filtroPostEst = e.target.value; render(); }
});

$app.addEventListener("input", e => {
  if(e.target.id === "clave" || e.target.id === "f_clave2") guardarClave(e.target.value);
  if(e.target.classList.contains("lk")) linkBorrador = e.target.value;
  if(e.target.classList.contains("bulk")) bulkBorrador = e.target.value;
});

$app.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a;
  if(a === "nueva"){ editando = vacio(); mensaje = null; render(); window.scrollTo({ top: 0 }); }
  else if(a === "editar"){ editando = Object.assign(vacio(), lista.find(x => x.id === el.dataset.id)); mensaje = null; render(); window.scrollTo({ top: 0 }); }
  else if(a === "cancelar"){ editando = null; mensaje = null; render(); }
  else if(a === "link"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador primero." }; return render(); }
    const v = lista.find(x => x.id === el.dataset.id);
    linkAbierto = el.dataset.id; linkBorrador = (v && v.linkAgenda) || ""; bulkAbierto = false; mensaje = null; render();
  }
  else if(a === "link-cancelar"){ linkAbierto = null; linkBorrador = ""; mensaje = null; render(); }
  else if(a === "link-guardar" || a === "link-quitar"){
    const quitar = a === "link-quitar";
    const url = quitar ? "" : linkBorrador.trim();
    if(!quitar && !/^https:\/\//i.test(url)){ mensaje = { t: "err", x: "El link debe empezar con https://" }; return render(); }
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador." }; return render(); }
    const v = Object.assign(vacio(), lista.find(x => x.id === el.dataset.id), { linkAgenda: url });
    const res = await guardarVacante(v);
    if(res.ok){
      linkAbierto = null; linkBorrador = "";
      mensaje = { t: "ok", x: quitar ? "Link quitado." : "Link guardado. Quien pase el prefiltro ya puede agendar." };
    } else { mensaje = { t: "err", x: res.razon }; }
    render();
  }
  else if(a === "bulk"){ bulkAbierto = !bulkAbierto; bulkBorrador = ""; linkAbierto = null; mensaje = null; render(); }
  else if(a === "bulk-aplicar"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador." }; return render(); }
    if(!/^https:\/\//i.test(bulkBorrador.trim())){ mensaje = { t: "err", x: "El link debe empezar con https://" }; return render(); }
    await aplicarLinkATodas(bulkBorrador.trim());
  }
  else if(a === "postulantes" || a === "refrescar"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador para ver los postulantes." }; return render(); }
    mensaje = null; verPost = true; cargarPostulantes();
  }
  else if(a === "volver-lista"){ verPost = false; render(); }
  else if(a === "toggle"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador primero." }; return render(); }
    const v = Object.assign(vacio(), lista.find(x => x.id === el.dataset.id));
    v.estado = v.estado === "Activa" ? "Cerrada" : "Activa";
    const res = await guardarVacante(v);
    mensaje = res.ok ? { t: "ok", x: v.estado === "Activa" ? "Vacante reabierta." : "Vacante cerrada." }
                     : { t: "err", x: res.razon };
    render();
  }
  else if(a === "guardar"){
    const v = leerForm();
    if(!v.nombre){ mensaje = { t: "err", x: "Escribe el nombre de la vacante." }; return render(); }
    if(v.linkAgenda && !/^https:\/\//i.test(v.linkAgenda)){ mensaje = { t: "err", x: "El link de agendamiento debe empezar con https://" }; return render(); }
    const c = val("f_clave2"); if(c) guardarClave(c);
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador." }; return render(); }
    if(!v.id) v.id = idNuevo(v.nombre);
    editando = v;
    const res = await guardarVacante(v);
    if(res.ok){
      editando = null; mensaje = { t: "ok", x: "Vacante guardada. Ya aparece en la página pública si está Activa." };
    } else { mensaje = { t: "err", x: res.razon }; }
    render();
  }
});

render();
cargar();
</script>
</body>
</html>
