<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrar vacantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2F7; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4E5D72; --line:#D3DAE5;
    --accent:#1F4FFF; --accent-ink:#FFFFFF; --accent-soft:#E3EAFF;
    --ok:#0F7B55; --ok-soft:#DDF3EA; --warn:#7A5000; --warn-soft:#FFF0CC;
    --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
    --body:"Public Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
      --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
      --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C1420; --surface:#131E2D; --ink:#E8EEF7; --muted:#9FADC1; --line:#263449;
    --accent:#86A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A4D;
    --ok:#5FD3A2; --ok-soft:#12332A; --warn:#F2C46B; --warn-soft:#3A2E10;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55}
  .wrap{max-width:720px; margin:0 auto; padding:20px 20px 64px}
  h1{font-family:var(--display); font-weight:700; font-size:clamp(28px,6vw,38px); line-height:1.1; letter-spacing:-.02em; margin:8px 0 8px}
  h1:focus{outline:none}
  h2{font-family:var(--display); font-weight:700; font-size:19px; margin:0 0 8px}
  .lead{color:var(--muted); margin:0 0 24px}
  label{display:block; font-weight:600; font-size:14px; margin:18px 0 6px}
  .hint{color:var(--muted); font-size:13px; font-weight:400; margin:4px 0 0}
  input[type=text],input[type=password],textarea,select{
    width:100%; font:inherit; color:var(--ink); background:var(--surface);
    border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
  }
  textarea{min-height:88px; resize:vertical}
  input:focus,textarea:focus,select:focus{outline:3px solid var(--accent); outline-offset:2px; border-color:var(--accent)}
  .btn{font:inherit; font-weight:600; cursor:pointer; border-radius:12px; padding:12px 18px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); min-height:46px}
  .btn:hover{background:var(--accent-soft); border-color:var(--accent)}
  .btn.solid{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.small{min-height:38px; padding:7px 14px; font-size:14px}
  .btn[disabled]{opacity:.55; cursor:default}
  .actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:24px}
  :focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:6px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:12px}
  .vrow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .vrow h2{margin:0}
  .chip{font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px}
  .chip.on{background:var(--ok-soft); color:var(--ok)}
  .chip.off{background:var(--warn-soft); color:var(--warn)}
  .chip.falta{background:var(--warn-soft); color:var(--warn)}
  .linkbox{margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}
  .url{word-break:break-all; color:var(--muted); font-size:13px; margin:10px 0 0}
  .aviso{color:var(--warn); margin:10px 0 0}
  .btns{display:flex; gap:8px; flex-wrap:wrap}
  .msg{padding:12px 16px; border-radius:12px; margin:16px 0; font-size:15px}
  .msg.ok{background:var(--ok-soft); color:var(--ok)}
  .msg.err{background:var(--warn-soft); color:var(--warn)}
  .msg.info{background:var(--accent-soft)}
  a{color:var(--accent)}
  summary{cursor:pointer; font-weight:600; margin-top:10px}
  details p{margin:8px 0 0; font-size:15px}
  .linkback{background:none; border:0; padding:6px 0; font:inherit; font-weight:600; color:var(--muted); cursor:pointer}
  .linkback:hover{color:var(--accent)}
  .qcard{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px 16px; margin-top:12px}
  .qhead{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
  .qhead strong{font-family:var(--display); font-size:16px}
  .qcard label{margin-top:12px}
  .chk{display:flex; align-items:center; gap:10px; font-weight:400; margin:8px 0 0; cursor:pointer}
  .chk input{width:20px; height:20px; accent-color:var(--accent)}
  .qadd{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
  .qadd select{flex:1; min-width:180px}
</style>
</head>
<body>
<div class="wrap">
  <main id="app"></main>
</div>

<script src="config.js"></script>
<script>
/* La URL del Apps Script se configura en config.js */
const ENDPOINT = (window.CONFIG || {}).ENDPOINT || "";

const CAMPOS_LISTA = ["sedes", "beneficios", "etapas", "requisitos"];
let lista = [], clave = "", editando = null, mensaje = null, guardando = false, cargando = true;
let linkAbierto = null, linkBorrador = "", bulkAbierto = false, bulkBorrador = "";
let postMsg = null, aprobando = null;
let verPost = false, postulantes = [], postCargando = false, postError = "", filtroPostVac = "todas", filtroPostEst = "todos";
try{ clave = sessionStorage.getItem("clave_admin") || ""; }catch(e){}

const $app = document.getElementById("app");
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const quitaTildes = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const slug = s => quitaTildes(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "vacante";

async function traer(){
  const r = await fetch(ENDPOINT + "?accion=vacantes&t=" + Date.now());
  const j = await r.json();
  return j.vacantes || [];
}

async function cargar(){
  if(!ENDPOINT){ cargando = false; return render(); }
  cargando = true; render();
  try{ lista = await traer(); mensaje = null; }
  catch(e){ mensaje = { t: "err", x: "No se pudieron cargar las vacantes. Revisa la URL del script y que esté publicado para «Cualquier persona»." }; }
  cargando = false; render();
}

/* Envía la vacante. Primero intenta leer la respuesta del script para saber el motivo exacto;
   si el navegador no lo permite, envía igual y confirma leyendo la hoja. */
async function enviar(v){
  const cuerpo = JSON.stringify({ tipo: "vacante_guardar", clave, vacante: v });
  const cab = { "Content-Type": "text/plain;charset=utf-8" };
  try{
    const r = await fetch(ENDPOINT, { method: "POST", headers: cab, body: cuerpo });
    return await r.json();
  }catch(e){}
  try{ await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: cab, body: cuerpo }); }catch(e){}
  return null;
}

const MOTIVOS = {
  clave: "La clave no coincide con la que pusiste en el script (CLAVE_ADMIN). Revisa mayúsculas y espacios.",
  clave_por_defecto: "En el script todavía está la clave de ejemplo («cambia-esta-clave»). Cámbiala, guarda y publica una versión nueva (Implementar > Administrar implementaciones > lápiz > Versión: Nueva versión).",
  id: "La vacante no tiene identificador. Escribe un nombre e intenta de nuevo."
};

/* Para confirmar que la escritura llegó comparamos solo los campos de texto simple:
   la hoja los devuelve idénticos a como se enviaron. Las listas quedan fuera a propósito,
   porque el script las guarda unidas por saltos de línea y una diferencia de formato haría
   que un guardado correcto pareciera fallido. */
const CAMPOS_FIRMA = ["nombre", "estado", "descripcion", "salario", "horario", "modalidad", "tiempos", "inglesMin", "linkAgenda"];
const firma = v => JSON.stringify(CAMPOS_FIRMA.map(c => String(v[c] == null ? "" : v[c]).trim()));

async function guardarVacante(v){
  guardando = true; mensaje = { t: "info", x: "Guardando…" }; render();
  const j = await enviar(v);
  if(j && j.ok === false){
    guardando = false;
    return { ok: false, razon: MOTIVOS[j.error] || ("El script rechazó el guardado (" + j.error + ").") };
  }
  const esperas = [400, 700, 1200, 1800, 2500, 3500];
  try{
    for(const ms of esperas){
      await sleep(ms);
      const nueva = await traer();
      const g = nueva.find(x => x.id === v.id);
      if(g && firma(g) === firma(v)){ lista = nueva; guardando = false; return { ok: true }; }
    }
  }catch(e){}
  guardando = false;
  return { ok: false, razon: "El cambio no aparece todavía en la hoja, así que no podemos confirmarlo. Abre la pestaña «Vacantes»: si el cambio está, sí se guardó y basta con actualizar esta página. Si no está, vuelve a intentarlo." };
}

const vacio = () => ({ id: "", estado: "Activa", nombre: "", descripcion: "", sedes: [], salario: "", beneficios: [], horario: "", modalidad: "", etapas: [], tiempos: "", requisitos: [], palabrasClave: [], linkAgenda: "", inglesMin: "B2+", responsabilidades: [], salarioMax: "", monedaSalarioMax: "COP", rec1Nombre: "", rec2Nombre: "", rec2Link: "", rec3Nombre: "", rec3Link: "", preguntas: preguntasPorDefecto({}) });

/* ---------- Preguntas del prefiltro ---------- */
const TIPOS_PREG = [
  ["texto", "Respuesta abierta"],
  ["sino", "Sí / No"],
  ["opciones", "Opción múltiple"],
  ["ingles", "Nivel de inglés"],
  ["salario", "Expectativa salarial"]
];
const tipoNombre = t => (TIPOS_PREG.find(x => x[0] === t) || TIPOS_PREG[0])[1];
const UNICOS = ["ingles", "salario"]; // solo puede haber una de cada una por vacante
const idPregunta = () => "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const listaTxt = x => Array.isArray(x) ? x.map(String).filter(Boolean) : [];

// Las vacantes creadas antes de este cambio usan estas 5 preguntas (las mismas que veía el candidato).
function preguntasPorDefecto(v){
  const ps = [
    { id: "exp", tipo: "texto", texto: "Cuéntanos sobre tu experiencia relacionada con este rol", ayuda: "Puedes mencionar cargos, funciones, herramientas o logros.", min: 25, palabras: listaTxt(v.palabrasClave) },
    { id: "full", tipo: "sino", texto: "¿Tienes disponibilidad de tiempo completo?", ayuda: "", pasa: "Sí" },
    { id: "viaje", tipo: "sino", texto: "¿Tienes algún viaje planeado próximamente?", ayuda: "", pasa: "No" }
  ];
  if(v.inglesMin !== "ninguno") ps.push({ id: "ingles", tipo: "ingles", texto: "¿Cuál es tu nivel de inglés?", ayuda: "Elige el que mejor te describa.", min: ["B2","B2+","C1","Nativo"].includes(v.inglesMin) ? v.inglesMin : "B2+" });
  ps.push({ id: "salario", tipo: "salario", texto: "¿Cuál es tu expectativa salarial?", ayuda: "", tope: String(v.salarioMax || "").replace(/\D/g, ""), moneda: v.monedaSalarioMax || "COP" });
  return ps;
}

function preguntaNueva(tipo){
  const base = { id: idPregunta(), tipo, texto: "", ayuda: "" };
  if(tipo === "texto") return Object.assign(base, { min: 0, palabras: [] });
  if(tipo === "sino") return Object.assign(base, { pasa: "Sí" });
  if(tipo === "opciones") return Object.assign(base, { opciones: [], aprobadas: [] });
  if(tipo === "ingles") return Object.assign(base, { texto: "¿Cuál es tu nivel de inglés?", ayuda: "Elige el que mejor te describa.", min: "B2+" });
  return Object.assign(base, { tipo: "salario", texto: "¿Cuál es tu expectativa salarial?", tope: "", moneda: "COP" });
}

function opcionesTipo(actual, i){
  const usados = (editando.preguntas || []).filter((q, j) => j !== i).map(q => q.tipo);
  return TIPOS_PREG.map(([k, t]) => {
    const bloqueado = UNICOS.includes(k) && usados.includes(k);
    return `<option value="${k}" ${actual === k ? "selected" : ""} ${bloqueado ? "disabled" : ""}>${t}${bloqueado ? " (ya existe)" : ""}</option>`;
  }).join("");
}

function configPregunta(q, i){
  if(q.tipo === "texto") return `
    <label for="qmin_${i}">Mínimo de caracteres</label>
    <input type="text" id="qmin_${i}" inputmode="numeric" value="${esc(q.min || 0)}">
    <p class="hint">El candidato no puede continuar con menos de esto. Pon 0 si basta con que escriba algo.</p>
    <label for="qpal_${i}">Palabras clave (opcional)</label>
    <input type="text" id="qpal_${i}" value="${esc(listaTxt(q.palabras).join(", "))}" placeholder="bpo, clientes, kpis">
    <p class="hint">Separadas por coma. Si pones palabras, la respuesta debe mencionar al menos una para pasar el filtro.</p>`;
  if(q.tipo === "sino") return `
    <label for="qpasa_${i}">Pasa el filtro si responde</label>
    <select id="qpasa_${i}">${[["Sí","Sí"],["No","No"],["cualquiera","Cualquiera (solo informativa)"]].map(([k, t]) => `<option value="${k}" ${(q.pasa || "cualquiera") === k ? "selected" : ""}>${t}</option>`).join("")}</select>`;
  if(q.tipo === "opciones"){
    const ops = listaTxt(q.opciones), ap = listaTxt(q.aprobadas);
    return `
    <label for="qop_${i}">Opciones</label>
    <textarea id="qop_${i}" data-qop="${i}" placeholder="Una por línea">${esc(ops.join("\n"))}</textarea>
    <p class="hint">Una por línea, mínimo 2.</p>
    ${ops.length ? `<p style="font-weight:600;font-size:14px;margin:14px 0 0">¿Cuáles pasan el filtro?</p>
      ${ops.map(o => `<label class="chk"><input type="checkbox" data-ap="${i}" value="${esc(o)}" ${ap.includes(o) ? "checked" : ""}>${esc(o)}</label>`).join("")}
      <p class="hint">Si no marcas ninguna, todas pasan.</p>` : ""}`;
  }
  if(q.tipo === "ingles") return `
    <label for="qing_${i}">Nivel mínimo para pasar</label>
    <select id="qing_${i}">${[["B2","B2 o superior"],["B2+","B2+ o superior"],["C1","C1 o superior"],["Nativo","Nativo"]].map(([k, t]) => `<option value="${k}" ${(q.min || "B2+") === k ? "selected" : ""}>${t}</option>`).join("")}</select>
    <p class="hint">El candidato elige entre: A1 a B1, B2, B2+, C1 y Nativo.</p>`;
  return `
    <label for="qtope_${i}">Tope de expectativa salarial (opcional)</label>
    <div style="display:flex;gap:10px">
      <input type="text" id="qtope_${i}" data-monto="1" inputmode="numeric" value="${esc(fmtMonto(q.tope))}" placeholder="7.000.000" style="flex:2">
      <select id="qmon_${i}" style="flex:1">${MONEDAS.map(m => `<option value="${m.code}" ${(q.moneda || "COP") === m.code ? "selected" : ""}>${m.code}</option>`).join("")}</select>
    </div>
    <p class="hint">Si pide más que este monto en la MISMA moneda, queda «En revisión». Si elige otra moneda no se evalúa (no hay conversión). Déjalo vacío para no filtrar por salario.</p>`;
}

function editorPreguntas(){
  const ps = editando.preguntas || [];
  const usados = ps.map(q => q.tipo);
  return `<h2 style="margin-top:32px">Preguntas del prefiltro</h2>
    <p class="hint" style="margin-top:0">Es lo que responde el candidato, en este orden. Si no pasa alguna, queda «En revisión» y no recibe el link de agendamiento automáticamente.</p>
    ${ps.map((q, i) => `<div class="qcard">
      <div class="qhead"><strong>Pregunta ${i + 1}</strong>
        <div class="btns">
          <button class="btn small" data-a="q-up" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="Subir pregunta ${i + 1}">↑</button>
          <button class="btn small" data-a="q-down" data-i="${i}" ${i === ps.length - 1 ? "disabled" : ""} aria-label="Bajar pregunta ${i + 1}">↓</button>
          <button class="btn small" data-a="q-del" data-i="${i}">Quitar</button>
        </div></div>
      <label for="qtipo_${i}">Tipo</label>
      <select id="qtipo_${i}" data-qtipo="${i}">${opcionesTipo(q.tipo, i)}</select>
      <label for="qt_${i}">Pregunta *</label>
      <input type="text" id="qt_${i}" value="${esc(q.texto)}" placeholder="Ej: ¿Tienes experiencia en ventas?">
      <label for="qa_${i}">Texto de ayuda (opcional)</label>
      <input type="text" id="qa_${i}" value="${esc(q.ayuda)}" placeholder="Aparece debajo de la pregunta">
      ${configPregunta(q, i)}
    </div>`).join("")}
    ${ps.length ? "" : `<div class="msg err">Agrega al menos una pregunta.</div>`}
    <div class="qadd">
      <select id="q_nuevo" aria-label="Tipo de la pregunta nueva">${TIPOS_PREG.map(([k, t]) => `<option value="${k}" ${UNICOS.includes(k) && usados.includes(k) ? "disabled" : ""}>${t}${UNICOS.includes(k) && usados.includes(k) ? " (ya existe)" : ""}</option>`).join("")}</select>
      <button class="btn small solid" data-a="q-add">Agregar pregunta</button>
    </div>`;
}

function leerPreguntas(){
  const hay = id => !!document.getElementById(id);
  return (editando.preguntas || []).map((q, i) => {
    if(!hay("qt_" + i)) return q;
    const tipo = val("qtipo_" + i) || q.tipo;
    const cambio = tipo !== q.tipo;
    const n = cambio ? Object.assign(preguntaNueva(tipo), { id: q.id }) : Object.assign({}, q);
    n.texto = val("qt_" + i).trim();
    n.ayuda = val("qa_" + i).trim();
    if(cambio) return n;
    if(tipo === "texto"){
      n.min = Math.max(0, Math.min(500, parseInt(val("qmin_" + i), 10) || 0));
      n.palabras = val("qpal_" + i).split(",").map(x => quitaTildes(x.trim().toLowerCase())).filter(Boolean);
    } else if(tipo === "sino"){
      n.pasa = val("qpasa_" + i) || "cualquiera";
    } else if(tipo === "opciones"){
      n.opciones = [...new Set(lineas("qop_" + i))];
      const marcadas = [...document.querySelectorAll(`input[data-ap="${i}"]:checked`)].map(x => x.value);
      n.aprobadas = n.opciones.filter(o => marcadas.includes(o));
    } else if(tipo === "ingles"){
      n.min = val("qing_" + i) || "B2+";
    } else if(tipo === "salario"){
      n.tope = val("qtope_" + i).replace(/\D/g, "");
      n.moneda = val("qmon_" + i) || "COP";
    }
    return n;
  });
}

// Guarda lo escrito en pantalla, aplica el cambio y redibuja sin perder la posición.
function cambiarPreguntas(fn){
  editando = leerForm();
  fn(editando.preguntas);
  const y = window.scrollY;
  render();
  window.scrollTo({ top: y });
}
const MONEDAS = [
  { code: "COP", label: "COP - Pesos colombianos" },
  { code: "USD", label: "USD - Dólares" },
  { code: "EUR", label: "EUR - Euros" },
  { code: "MXN", label: "MXN - Pesos mexicanos" }
];

const sinLink = v => v.estado === "Activa" && !v.linkAgenda;
const fmtMonto = n => String(n == null ? "" : n).replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");

function editorLink(v){
  return `<div class="linkbox">
    <label class="hint" style="display:block;margin:0 0 6px">Link de agendamiento. Debe empezar con https://</label>
    <input class="lk" type="text" value="${esc(linkBorrador)}" placeholder="https://calendly.com/tu-usuario/entrevista" aria-label="Link de agendamiento de ${esc(v.nombre)}">
    <div class="btns" style="margin-top:10px">
      <button class="btn small solid" data-a="link-guardar" data-id="${esc(v.id)}" ${guardando ? "disabled" : ""}>Guardar link</button>
      ${v.linkAgenda ? `<button class="btn small" data-a="link-quitar" data-id="${esc(v.id)}" ${guardando ? "disabled" : ""}>Quitar</button>` : ""}
      <button class="btn small" data-a="link-cancelar" ${guardando ? "disabled" : ""}>Cancelar</button>
    </div></div>`;
}

function filaVacante(v){
  const falta = sinLink(v);
  return `<div class="card"><div class="vrow">
      <div><h2>${esc(v.nombre)}</h2><span class="chip ${v.estado === "Activa" ? "on" : "off"}">${esc(v.estado)}</span>${falta ? ` <span class="chip falta">Sin link de agendamiento</span>` : ""}</div>
      <div class="btns">
        <button class="btn small" data-a="link" data-id="${esc(v.id)}">${v.linkAgenda ? "Cambiar link" : "Poner link"}</button>
        <button class="btn small" data-a="editar" data-id="${esc(v.id)}">Editar</button>
        <button class="btn small" data-a="toggle" data-id="${esc(v.id)}">${v.estado === "Activa" ? "Cerrar" : "Reabrir"}</button>
      </div></div>
    ${falta ? `<p class="hint aviso">Quien pase el prefiltro no podrá agendar: solo verá un aviso de que el enlace estará disponible pronto.</p>` : ""}
    ${linkAbierto === v.id ? editorLink(v) : (v.linkAgenda ? `<p class="url">${esc(v.linkAgenda)}</p>` : "")}</div>`;
}

function cajaBulk(n){
  if(!bulkAbierto) return "";
  return `<div class="card"><h2>Poner el mismo link en todas</h2>
    <p class="hint" style="margin:6px 0 10px">Se aplicará a las ${n} vacantes activas que hoy no tienen link. Las que ya tienen uno propio no se tocan.</p>
    <input class="bulk" type="text" value="${esc(bulkBorrador)}" placeholder="https://calendly.com/tu-usuario/entrevista" aria-label="Link de agendamiento para todas las vacantes sin link">
    <div class="btns" style="margin-top:10px">
      <button class="btn small solid" data-a="bulk-aplicar" ${guardando ? "disabled" : ""}>Aplicar a las ${n}</button>
      <button class="btn small" data-a="bulk" ${guardando ? "disabled" : ""}>Cancelar</button>
    </div></div>`;
}

async function aplicarLinkATodas(url){
  const objetivo = lista.filter(sinLink);
  guardando = true; mensaje = { t: "info", x: `Aplicando el link a ${objetivo.length} vacante(s)…` }; render();
  let rechazo = null;
  for(const v of objetivo){
    const j = await enviar(Object.assign(vacio(), v, { linkAgenda: url }));
    if(j && j.ok === false){ rechazo = MOTIVOS[j.error] || ("El script rechazó el guardado (" + j.error + ")."); break; }
  }
  guardando = false;
  if(rechazo){ mensaje = { t: "err", x: rechazo }; return render(); }
  await cargar();
  const faltan = lista.filter(sinLink).length;
  bulkAbierto = false; bulkBorrador = "";
  mensaje = faltan
    ? { t: "err", x: `Quedaron ${faltan} vacante(s) sin link. Vuelve a intentarlo o ponlas una por una.` }
    : { t: "ok", x: `Link aplicado a ${objetivo.length} vacante(s).` };
  render();
}

async function cargarPostulantes(){
  postCargando = true; postError = ""; postMsg = null; render();
  try{
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ tipo: "postulantes_listar", clave }) });
    const j = await r.json();
    if(j.ok){ postulantes = j.postulantes || []; }
    else { postError = MOTIVOS[j.error] || ("El script rechazó la consulta (" + j.error + ")."); }
  }catch(e){
    postError = "No se pudieron cargar desde aquí. Puedes verlos directamente en la pestaña «Postulantes» de tu hoja de Google.";
  }
  postCargando = false; render();
}

async function cambiarEstadoPostulante(fecha, correo, estado){
  try{
    const r = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ tipo: "postulante_estado", clave, fecha, correo, estado }) });
    const j = await r.json();
    if(j.ok && j.actualizado) return { ok: true };
    if(j.ok) return { ok: false, razon: "El script de Google todavía es una versión anterior y no sabe aprobar postulantes. Pega el apps_script.gs nuevo y publica una versión nueva." };
    if(j.error === "no_encontrado") return { ok: false, razon: "No se encontró a esa persona en la hoja. Presiona «Actualizar» e intenta de nuevo." };
    return { ok: false, razon: MOTIVOS[j.error] || ("El script rechazó el cambio (" + j.error + ").") };
  }catch(e){
    return { ok: false, razon: "No se pudo confirmar el cambio desde aquí. Revisa la columna «Estado» en la pestaña «Postulantes» de tu hoja." };
  }
}

function linkParaVacante(nombre){
  const v = lista.find(x => x.nombre === nombre);
  if(v && v.linkAgenda) return v.linkAgenda;
  if(v && v.rec2Link) return v.rec2Link;
  if(v && v.rec3Link) return v.rec3Link;
  return (window.CONFIG || {}).AGENDA_LINK || "";
}

function mailtoLink(p){
  const link = linkParaVacante(p.vacante);
  if(!link) return "";
  const asunto = "Agenda tu entrevista - " + p.vacante;
  const cuerpo = "Hola " + p.nombre + ",\n\nGracias por postularte a " + p.vacante + ". Tu perfil avanzó en el proceso. Agenda tu entrevista en este enlace:\n" + link + "\n\n¡Quedamos atentos!";
  return "mailto:" + encodeURIComponent(p.correo) + "?subject=" + encodeURIComponent(asunto) + "&body=" + encodeURIComponent(cuerpo);
}

function accionesPostulante(p){
  if(p.estado === "En revisión"){
    const ocupado = aprobando === p.fecha + "|" + p.correo;
    return `<div class="btns" style="margin-top:12px"><button class="btn small solid" data-a="aprobar" data-fecha="${esc(p.fecha)}" data-correo="${esc(p.correo)}" ${ocupado ? "disabled" : ""}>${ocupado ? "Aprobando…" : "Aprobar"}</button></div>`;
  }
  if(p.estado === "Apto"){
    const m = mailtoLink(p);
    return m ? `<div class="btns" style="margin-top:12px"><a class="btn small" style="text-decoration:none;display:inline-flex;align-items:center" href="${m}">Enviar link por correo</a></div>` : "";
  }
  return "";
}

            : `<p><strong>Tiempo completo:</strong> ${esc(p.tiempoCompleto)}. <strong>Viaje planeado:</strong> ${esc(p.viaje)}. <strong>Inglés:</strong> ${esc(p.ingles)}.</p>
          <p><strong>Expectativa salarial:</strong> ${p.expectativa ? esc(p.moneda || "COP") + " " + esc(fmtMonto(p.expectativa)) : "sin dato"}${(() => { const vv = lista.find(x => x.nombre === p.vacante); return vv && vv.salarioMax ? " (tope de la vacante: " + esc(vv.monedaSalarioMax || "COP") + " " + esc(fmtMonto(vv.salarioMax)) + ")" : ""; })()}</p>

      <select id="fp_vac" aria-label="Filtrar por vacante" style="flex:1;min-width:180px"><option value="todas">Todas las vacantes</option>${vacs.map(v => `<option value="${esc(v)}" ${filtroPostVac === v ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>
      <select id="fp_est" aria-label="Filtrar por estado" style="flex:1;min-width:140px"><option value="todos">Todos</option><option ${filtroPostEst === "Apto" ? "selected" : ""}>Apto</option><option ${filtroPostEst === "En revisión" ? "selected" : ""}>En revisión</option></select>
      <button class="btn small" data-a="refrescar">Actualizar</button>

const val = id => (document.getElementById(id) || {}).value || "";
const lineas = id => val(id).split("\n").map(x => x.trim()).filter(Boolean);

function leerForm(){
  const v = Object.assign({}, editando);
  v.nombre = val("f_nombre").trim();
  v.estado = val("f_estado") === "Cerrada" ? "Cerrada" : "Activa";
  v.descripcion = val("f_descripcion").trim();
  v.responsabilidades = lineas("f_responsabilidades");
  v.sedes = lineas("f_sedes");
  v.salario = val("f_salario").trim();
  v.beneficios = lineas("f_beneficios");
  v.horario = val("f_horario").trim();
  v.modalidad = val("f_modalidad").trim();
  v.etapas = lineas("f_etapas");
  v.tiempos = val("f_tiempos").trim();
  v.requisitos = lineas("f_requisitos");
  v.preguntas = leerPreguntas();
  // Se copian a los campos de siempre para que el resto del panel (y el script) los sigan viendo
  const ps = v.preguntas;
  const pExp = ps.find(q => q.id === "exp") || ps.find(q => q.tipo === "texto");
  const pIng = ps.find(q => q.tipo === "ingles"), pSal = ps.find(q => q.tipo === "salario");
  v.palabrasClave = pExp ? listaTxt(pExp.palabras) : [];
  v.inglesMin = pIng ? pIng.min : "ninguno";
  v.salarioMax = pSal ? String(pSal.tope || "") : "";
  v.monedaSalarioMax = pSal ? (pSal.moneda || "COP") : "COP";
  v.linkAgenda = val("f_linkAgenda").trim();
  v.rec1Nombre = val("f_rec1Nombre").trim();
  v.rec2Nombre = val("f_rec2Nombre").trim();
  v.rec2Link = val("f_rec2Link").trim();
  v.rec3Nombre = val("f_rec3Nombre").trim();
  v.rec3Link = val("f_rec3Link").trim();
  return v;
}

function idNuevo(nombre){
  const base = slug(nombre); let id = base, n = 2;
  while(lista.some(x => x.id === id)){ id = base + "-" + n++; }
  return id;
}

function guardarClave(c){ clave = c; try{ sessionStorage.setItem("clave_admin", c); }catch(e){} }

$app.addEventListener("change", e => {
  if(e.target.id === "fp_vac"){ filtroPostVac = e.target.value; render(); }
  if(e.target.id === "fp_est"){ filtroPostEst = e.target.value; render(); }
  if(editando && (e.target.dataset.qtipo !== undefined || e.target.dataset.qop !== undefined)) cambiarPreguntas(() => {});
});

$app.addEventListener("input", e => {
  if(e.target.id === "clave" || e.target.id === "f_clave2") guardarClave(e.target.value);
  if(e.target.classList.contains("lk")) linkBorrador = e.target.value;
  if(e.target.classList.contains("bulk")) bulkBorrador = e.target.value;
  if(e.target.dataset.monto) e.target.value = fmtMonto(e.target.value);
});

$app.addEventListener("click", async e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a;
  if(a === "nueva"){ editando = vacio(); mensaje = null; render(); window.scrollTo({ top: 0 }); }
  else if(a === "editar"){
    const orig = lista.find(x => x.id === el.dataset.id) || {};
    editando = Object.assign(vacio(), orig);
    if(!Array.isArray(orig.preguntas) || !orig.preguntas.length) editando.preguntas = preguntasPorDefecto(orig);
    mensaje = null; render(); window.scrollTo({ top: 0 });
  }
  else if(a === "q-add"){
    const tipo = val("q_nuevo") || "texto";
    cambiarPreguntas(ps => ps.push(preguntaNueva(tipo)));
    const n = editando.preguntas.length - 1, campo = document.getElementById("qt_" + n);
    if(campo){ campo.focus(); campo.scrollIntoView({ block: "center" }); }
  }
  else if(a === "q-del"){ const i = +el.dataset.i; cambiarPreguntas(ps => ps.splice(i, 1)); }
  else if(a === "q-up" || a === "q-down"){
    const i = +el.dataset.i, j = a === "q-up" ? i - 1 : i + 1;
    cambiarPreguntas(ps => { if(j >= 0 && j < ps.length){ const t = ps[i]; ps[i] = ps[j]; ps[j] = t; } });
  }
  else if(a === "cancelar"){ editando = null; mensaje = null; render(); }
  else if(a === "link"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador primero." }; return render(); }
    const v = lista.find(x => x.id === el.dataset.id);
    linkAbierto = el.dataset.id; linkBorrador = (v && v.linkAgenda) || ""; bulkAbierto = false; mensaje = null; render();
  }
  else if(a === "link-cancelar"){ linkAbierto = null; linkBorrador = ""; mensaje = null; render(); }
  else if(a === "link-guardar" || a === "link-quitar"){
    const quitar = a === "link-quitar";
    const url = quitar ? "" : linkBorrador.trim();
    if(!quitar && !/^https:\/\//i.test(url)){ mensaje = { t: "err", x: "El link debe empezar con https://" }; return render(); }
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador." }; return render(); }
    const v = Object.assign(vacio(), lista.find(x => x.id === el.dataset.id), { linkAgenda: url });
    const res = await guardarVacante(v);
    if(res.ok){
      linkAbierto = null; linkBorrador = "";
      mensaje = { t: "ok", x: quitar ? "Link quitado." : "Link guardado. Quien pase el prefiltro ya puede agendar." };
    } else { mensaje = { t: "err", x: res.razon }; }
    render();
  }
  else if(a === "bulk"){ bulkAbierto = !bulkAbierto; bulkBorrador = ""; linkAbierto = null; mensaje = null; render(); }
  else if(a === "bulk-aplicar"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador." }; return render(); }
    if(!/^https:\/\//i.test(bulkBorrador.trim())){ mensaje = { t: "err", x: "El link debe empezar con https://" }; return render(); }
    await aplicarLinkATodas(bulkBorrador.trim());
  }
  else if(a === "postulantes" || a === "refrescar"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador para ver los postulantes." }; return render(); }
    mensaje = null; verPost = true; cargarPostulantes();
  }
  else if(a === "volver-lista"){ verPost = false; render(); }
  else if(a === "aprobar"){
    if(!clave){ postMsg = { t: "err", x: "Escribe la clave de administrador." }; return render(); }
    const fecha = el.dataset.fecha, correo = el.dataset.correo;
    aprobando = fecha + "|" + correo; postMsg = null; render();
    const res = await cambiarEstadoPostulante(fecha, correo, "Apto");
    aprobando = null;
    if(res.ok){
      const p = postulantes.find(x => x.fecha === fecha && x.correo === correo);
      if(p) p.estado = "Apto";
      postMsg = { t: "ok", x: (p ? p.nombre : "La persona") + " quedó como Apto. Usa el botón «Enviar link por correo» de su tarjeta para mandarle el link de la entrevista." };
    } else { postMsg = { t: "err", x: res.razon }; }
    render();
  }
  else if(a === "toggle"){
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador primero." }; return render(); }
    const v = Object.assign(vacio(), lista.find(x => x.id === el.dataset.id));
    v.estado = v.estado === "Activa" ? "Cerrada" : "Activa";
    const res = await guardarVacante(v);
    mensaje = res.ok ? { t: "ok", x: v.estado === "Activa" ? "Vacante reabierta." : "Vacante cerrada." }
                     : { t: "err", x: res.razon };
    render();
  }
  else if(a === "guardar"){
    const v = leerForm();
    editando = v; // conserva lo escrito en pantalla aunque una validación falle abajo
    if(!v.nombre){ mensaje = { t: "err", x: "Escribe el nombre de la vacante." }; return render(); }
    if(!v.preguntas.length){ mensaje = { t: "err", x: "Agrega al menos una pregunta al prefiltro." }; return render(); }
    const sinTexto = v.preguntas.findIndex(q => !q.texto);
    if(sinTexto >= 0){ mensaje = { t: "err", x: `Escribe el texto de la pregunta ${sinTexto + 1}.` }; return render(); }
    const pocas = v.preguntas.findIndex(q => q.tipo === "opciones" && listaTxt(q.opciones).length < 2);
    if(pocas >= 0){ mensaje = { t: "err", x: `La pregunta ${pocas + 1} necesita al menos 2 opciones.` }; return render(); }
    if(v.linkAgenda && !/^https:\/\//i.test(v.linkAgenda)){ mensaje = { t: "err", x: "El link del Reclutador 1 debe empezar con https://" }; return render(); }
    if(v.rec2Link && !/^https:\/\//i.test(v.rec2Link)){ mensaje = { t: "err", x: "El link del Reclutador 2 debe empezar con https://" }; return render(); }
    if(v.rec3Link && !/^https:\/\//i.test(v.rec3Link)){ mensaje = { t: "err", x: "El link del Reclutador 3 debe empezar con https://" }; return render(); }
    const c = val("f_clave2"); if(c) guardarClave(c);
    if(!clave){ mensaje = { t: "err", x: "Escribe la clave de administrador." }; return render(); }
    if(!v.id) v.id = idNuevo(v.nombre);
    editando = v;
    const res = await guardarVacante(v);
    if(res.ok){
      const g = lista.find(x => x.id === v.id);
      const scriptViejo = g && g.preguntas === undefined;
      editando = null;
      mensaje = scriptViejo
        ? { t: "err", x: "La vacante se guardó, pero el script de Google es una versión anterior y no guarda las preguntas. Pega el apps_script.gs nuevo y publica una versión nueva." }
        : { t: "ok", x: "Vacante guardada. Ya aparece en la página pública si está Activa." };
    } else { mensaje = { t: "err", x: res.razon }; }
    render();
  }
});

render();
cargar();
</script>
